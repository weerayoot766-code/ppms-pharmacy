<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxfglKSQrUlsmroFU2e8GGA2xA5qEpKGazPNAX6yor2lJH5Xgt5b2Lo1EQIb-nNOJejmA/exec';

/**
 * ดึงข้อมูล (GET) — แนบรหัสคำขอ (requestId) ไปด้วย
 * บางครั้งสคริปต์ทำงานเสร็จแล้ว แต่ตอนรับผล Google ตอบ 404 (script.googleusercontent.com) แทนผลลัพธ์
 * ถ้าเจอ: ถามผลจริงด้วยรหัสเดิมก่อน (เร็ว) ถ้ายังไม่ได้ค่อยส่งใหม่ด้วยรหัสเดิม — หลังบ้านจำผลไว้ จึงตอบได้ทันทีไม่ต้องทำงานซ้ำ
 */
async function apiGet(action, params = {}) {
  const requestId = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const query = new URLSearchParams({ action, ...params, requestId }).toString();
  for (let attempt = 1; ; attempt++) {
    try {
      const res = await fetch(`${API_URL}?${query}`);
      return await readApiJson(res);
    } catch (err) {
      const transient = err.nonJson || err instanceof TypeError;
      if (!transient || attempt >= 4) throw err;
      console.warn('[PPMS] Google ตอบกลับผิดพลาด (' + action + ') กำลังกู้คืนครั้งที่ ' + attempt);
      await new Promise(r => setTimeout(r, 250));
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        const r = await readApiJson(await fetch(`${API_URL}?${q}`));
        if (r && r.found) {
          if (!r.response.ok) throw new Error(r.response.error);
          return r.response.data;
        }
      } catch (e2) { if (!e2.nonJson && !(e2 instanceof TypeError)) throw e2; }
      // ยังไม่ได้ผล → วนส่งคำขอเดิมใหม่ทันที (ไม่ต้องรอนาน)
    }
  }
}


/**
 * อ่านผลตอบกลับจาก Apps Script อย่างปลอดภัย
 * บางครั้ง Google ตอบกลับเป็นหน้า HTML (<!DOCTYPE ...) แทน JSON ทั้งที่สคริปต์ทำงานเสร็จไปแล้ว
 * ถ้าเจอแบบนั้นจะโยน error ที่มี flag nonJson = true ให้ผู้เรียกตัดสินใจเองว่าจะลองใหม่/ตรวจสอบซ้ำอย่างไร
 */
async function readApiJson(res) {
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    const err = new Error('เซิร์ฟเวอร์ Google ตอบกลับผิดรูปแบบชั่วคราว (ไม่ใช่ข้อมูล JSON)');
    err.nonJson = true;
    throw err;
  }
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/**
 * บันทึกข้อมูล (POST) — แนบรหัสคำขอ (requestId) ไปด้วยทุกครั้ง
 * ถ้า Google ตอบกลับเป็นหน้า HTML (ทั้งที่หลังบ้านบันทึกสำเร็จแล้ว) จะไปถามผลจริงด้วยรหัสนั้นผ่าน GET แทน
 * หลังบ้านจำผลของรหัสนี้ไว้ ถ้าคำขอเดิมถูกส่งซ้ำจะไม่ทำงานซ้ำ (กันบันทึกซ้ำ/ตัดสต๊อกซ้ำ)
 */
async function apiPost(action, payload = {}) {
  const requestId = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, requestId, ...payload }), // ห้ามตั้ง Content-Type เอง ไม่งั้นชน CORS preflight
    });
    return await readApiJson(res);
  } catch (err) {
    if (!err.nonJson && !(err instanceof TypeError)) throw err; // error จริงจากหลังบ้าน → แจ้งตามปกติ
    for (let attempt = 1; attempt <= 4; attempt++) {
      await new Promise(r => setTimeout(r, 700 * attempt));
      let r;
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        r = await readApiJson(await fetch(`${API_URL}?${q}`));
      } catch (e) { continue; }
      if (r && r.found) {
        if (!r.response.ok) throw new Error(r.response.error);
        return r.response.data;
      }
    }
    throw err;
  }
}


const SEARCH_INDEX_KEY = 'ppms_search_index_v1';
let index = [];       // [{code,name,hay,barcodes}]
let prod = null;      // ข้อมูลสินค้าที่เลือกอยู่
let lots = [];        // [{row, lotNo, exp, oldQty, qty, oldCost, cost, isNew}]
let showEmpty = false;
let loadToken = 0;

const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const fmt = (n, d = 2) => (Number(n) || 0).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const fmtQ = n => (Number(n) || 0).toLocaleString('th-TH', { maximumFractionDigits: 2 });

// ---------- รายชื่อยา (ใช้ชุดเดียวกับหน้าขาย จำไว้ในเครื่อง) ----------
function buildIndex(raw) {
  const bc = {};
  (raw.barcodes || []).forEach(([b, c]) => { (bc[c] = bc[c] || []).push(String(b).toLowerCase()); });
  index = (raw.products || []).map(([code, name, short, unit]) => ({ code, name, unit, hay: (name + ' ' + code + ' ' + short).toLowerCase(), barcodes: bc[code] || [] }));
}
try { const c = localStorage.getItem(SEARCH_INDEX_KEY); if (c) buildIndex(JSON.parse(c)); } catch (e) {}
apiGet('getSearchIndex').then(raw => { buildIndex(raw); try { localStorage.setItem(SEARCH_INDEX_KEY, JSON.stringify(raw)); } catch (e) {} }).catch(() => {});

const q = document.getElementById('q'), sug = document.getElementById('sug');
let hl = -1, results = [];
q.addEventListener('input', () => {
  const k = q.value.trim().toLowerCase();
  if (!k) { sug.classList.remove('show'); return; }
  const exact = index.filter(p => p.barcodes.includes(k) || p.code.toLowerCase() === k);
  results = exact.length ? exact : index.filter(p => p.hay.includes(k) || p.barcodes.some(b => b.includes(k))).slice(0, 30);
  hl = results.length ? 0 : -1;
  renderSug();
});
q.addEventListener('keydown', e => {
  if (!sug.classList.contains('show')) return;
  if (e.key === 'ArrowDown') { hl = Math.min(results.length - 1, hl + 1); renderSug(); e.preventDefault(); }
  else if (e.key === 'ArrowUp') { hl = Math.max(0, hl - 1); renderSug(); e.preventDefault(); }
  else if (e.key === 'Enter' && hl >= 0) { pick(results[hl].code); e.preventDefault(); }
  else if (e.key === 'Escape') sug.classList.remove('show');
});
document.addEventListener('click', e => { if (!e.target.closest('.search-wrap')) sug.classList.remove('show'); });
function renderSug() {
  sug.innerHTML = results.length
    ? results.map((p, i) => `<div class="sug-item ${i === hl ? 'hl' : ''}" onclick="pick('${esc(p.code)}')"><span>${esc(p.name)}</span><small>${esc(p.code)}</small></div>`).join('')
    : '<div class="sug-item"><span style="color:#8fa198;">ไม่พบรายการ' + (index.length ? '' : ' (รายชื่อยายังโหลดไม่เสร็จ ลองใหม่อีกครั้ง)') + '</span></div>';
  sug.classList.add('show');
}

// ---------- โหลดสินค้า ----------
function toDateInput(v) {
  if (!v) return '';
  const s = String(v);
  if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
  const d = new Date(v);
  if (isNaN(d)) return '';
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const todayStr = toDateInput(new Date());

async function pick(code) {
  sug.classList.remove('show');
  q.value = '';
  const my = ++loadToken;
  document.getElementById('area').innerHTML = '<div class="empty">⏳ กำลังโหลดข้อมูลสินค้า...</div>';
  let d;
  try { d = await apiGet('getProduct', { code, mode: 'pos' }); }
  catch (err) { if (my === loadToken) document.getElementById('area').innerHTML = `<div class="empty">โหลดไม่สำเร็จ: ${esc(err.message)}</div>`; return; }
  if (my !== loadToken) return;
  const p = d.product || {};
  const small = String(p['หน่วยเล็กสุด(อัตโนมัติ)'] || 'หน่วย');
  const mult = { [small]: 1 };
  const units = [{ label: small, mult: 1 }];
  (d.units || []).forEach(u => {
    const l = String(u['หน่วย(ใหญ่)'] || '').trim(), m = Number(u['ตัวคูณ(กี่หน่วยเล็กสุดต่อ 1 หน่วยนี้)']) || 1;
    if (l && !mult[l]) { mult[l] = m; units.push({ label: l, mult: m }); }
  });
  units.sort((a, b) => a.mult - b.mult);
  const priceOf = l => { const r = (d.prices || []).find(x => String(x['หน่วย']) === l); return r ? Number(r['ราคาขาย']) || 0 : ''; };
  prod = {
    code, name: p['ชื่อสินค้า'] || code, small, mult, units,
    latestCost: Number(p['ต้นทุนล่าสุด/หน่วย(อัตโนมัติ)']) || 0,
    newLatestCost: Number(p['ต้นทุนล่าสุด/หน่วย(อัตโนมัติ)']) || 0,
    prices: units.map(u => ({ unit: u.label, old: priceOf(u.label), price: priceOf(u.label) })),
  };
  lots = (d.stockLots || []).map(l => {
    const m = mult[String(l['หน่วยนับสต๊อก'] || '').trim()] || 1;
    const qty = (Number(l['จำนวนคงเหลือ']) || 0) * m;
    const cost = Math.round(((Number(l['ต้นทุนต่อหน่วยนับสต๊อก']) || 0) / m) * 10000) / 10000;
    const exp = toDateInput(l['วันหมดอายุ (EXP)']);
    return { row: l.__row, lotNo: String(l['เลขที่ผลิต'] || l['รหัสสต็อค'] || ''), exp, oldExp: exp, oldLot: String(l['เลขที่ผลิต'] || l['รหัสสต็อค'] || ''),
      oldQty: qty, qty, oldCost: cost, cost, isNew: false };
  }).sort((a, b) => (a.exp || '9999') < (b.exp || '9999') ? -1 : 1);
  showEmpty = false;
  if (!lots.some(l => l.oldQty > 0)) addLot(true);
  render();
}

function addLot(silent) {
  lots.push({ row: null, lotNo: '', exp: '', oldExp: '', oldLot: '', oldQty: 0, qty: '', oldCost: 0, cost: prod.latestCost || '', isNew: true });
  if (!silent) render();
}
function removeLot(i) { lots.splice(i, 1); render(); }

function bigUnitEq(perSmall) {
  const big = prod.units.filter(u => u.mult > 1);
  if (!big.length || !(Number(perSmall) > 0)) return '';
  return big.map(u => `= ${fmt(perSmall * u.mult)} /${esc(u.label)}`).join(' · ');
}
function qtyEq(n) {
  const big = prod.units.filter(u => u.mult > 1).sort((a, b) => b.mult - a.mult)[0];
  if (!big || !(n >= big.mult)) return '';
  const whole = Math.floor(n / big.mult), rest = n - whole * big.mult;
  return `= ${whole} ${esc(big.label)}${rest ? ' ' + fmtQ(rest) + ' ' + esc(prod.small) : ''}`;
}

function render() {
  if (!prod) return;
  const visible = lots.map((l, i) => ({ l, i })).filter(({ l }) => showEmpty || l.isNew || l.oldQty > 0);
  const hidden = lots.filter(l => !l.isNew && l.oldQty <= 0).length;
  const unitText = prod.units.filter(u => u.mult > 1).map(u => `1 ${esc(u.label)} = ${fmtQ(u.mult)} ${esc(prod.small)}`).join(', ');
  document.getElementById('area').innerHTML = `
    <div class="prod-head"><h3>${esc(prod.name)}</h3><span class="prod-meta">รหัส ${esc(prod.code)} · นับสต๊อกเป็น <b>${esc(prod.small)}</b>${unitText ? ' (' + unitText + ')' : ''}</span></div>

    <div class="sec-title">ล็อตคงคลัง <span class="sub">จำนวนและต้นทุนเป็น "ต่อ ${esc(prod.small)}"</span>
      ${hidden ? `<button class="link-btn" onclick="showEmpty=!showEmpty;render()">${showEmpty ? 'ซ่อน' : 'แสดง'}ล็อตที่หมดแล้ว (${hidden})</button>` : ''}</div>
    <table class="t">
      <thead><tr><th>เลขล็อต</th><th style="width:150px;">วันหมดอายุ</th><th class="num" style="width:90px;">จำนวนเดิม</th><th style="width:130px;">จำนวนใหม่</th><th style="width:150px;">ทุน/${esc(prod.small)}</th><th style="width:40px;"></th></tr></thead>
      <tbody>
        ${visible.length ? visible.map(({ l, i }) => {
          const diff = (l.qty === '' ? 0 : Number(l.qty)) - l.oldQty;
          const expired = l.exp && l.exp < todayStr;
          return `<tr>
            <td data-l="เลขล็อต">${l.isNew ? '<span class="badge-new">ล็อตใหม่</span> ' : ''}<input value="${esc(l.lotNo)}" placeholder="เลขล็อต" oninput="lots[${i}].lotNo=this.value;mark(this,${i},'lot')" class="${!l.isNew && l.lotNo !== l.oldLot ? 'changed' : ''}"></td>
            <td data-l="วันหมดอายุ"><input type="date" value="${esc(l.exp)}" onchange="lots[${i}].exp=this.value;render()" class="${!l.isNew && l.exp !== l.oldExp ? 'changed' : ''}">${expired ? '<span class="badge-exp">หมดอายุแล้ว</span>' : ''}</td>
            <td data-l="จำนวนเดิม" class="num"><span class="old-qty">${l.isNew ? '-' : fmtQ(l.oldQty)}</span></td>
            <td data-l="จำนวนใหม่ (${esc(prod.small)})"><input type="number" min="0" step="any" value="${l.qty}" oninput="lots[${i}].qty=this.value===''?'':Math.max(0,Number(this.value));updRow(${i})" class="${!l.isNew && Number(l.qty) !== l.oldQty ? 'changed' : ''}">
              <div class="eq" id="qeq${i}">${diff ? `<span class="diff ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : ''}${fmtQ(diff)}</span> ` : ''}${qtyEq(Number(l.qty) || 0)}</div></td>
            <td data-l="ทุน/${esc(prod.small)}"><input type="number" min="0" step="any" value="${l.cost}" oninput="lots[${i}].cost=this.value===''?'':Math.max(0,Number(this.value));updRow(${i})" class="${!l.isNew && Number(l.cost) !== l.oldCost ? 'changed' : ''}">
              <div class="eq" id="ceq${i}">${bigUnitEq(Number(l.cost))}</div></td>
            <td>${l.isNew ? `<button class="del-x" title="ลบล็อตใหม่นี้" onclick="removeLot(${i})">✕</button>` : ''}</td>
          </tr>`; }).join('') : `<tr><td colspan="6" class="empty">ไม่มีล็อตที่มีของเหลืออยู่</td></tr>`}
      </tbody>
    </table>
    <button class="btn-light" onclick="addLot()">＋ เพิ่มล็อตใหม่ (เช่น ยอดยกมา / ของที่นับเจอเพิ่ม)</button>
    <div class="totals" id="totals"></div>

    <div class="sec-title">ราคาทุน / ราคาขาย</div>
    <div class="grid">
      <div class="f"><label>ต้นทุนล่าสุด / ${esc(prod.small)} (ที่หน้าขายแสดง)</label>
        <input type="number" min="0" step="any" id="latestCost" value="${prod.newLatestCost}" oninput="prod.newLatestCost=this.value===''?'':Math.max(0,Number(this.value));document.getElementById('lceq').innerHTML=bigUnitEq(prod.newLatestCost)">
        <div class="eq" id="lceq">${bigUnitEq(prod.newLatestCost)}</div></div>
      ${prod.prices.map((p, i) => `<div class="f"><label>ราคาขายปกติ (ราคา1) / ${esc(p.unit)}</label>
        <input type="number" min="0" step="any" value="${p.price}" placeholder="ยังไม่ได้ตั้งราคา" oninput="prod.prices[${i}].price=this.value===''?'':Math.max(0,Number(this.value))"></div>`).join('')}
    </div>

    <div class="sec-title">เหตุผลการปรับ</div>
    <div class="grid">
      <div class="f"><select id="reason">
        <option>ยอดยกมาจากระบบเดิม</option><option>นับสต๊อกจริง</option><option>ของเสีย / แตก / ชำรุด</option>
        <option>หมดอายุ / ทำลาย</option><option>แก้ไขข้อมูลผิด</option><option>อื่นๆ</option></select></div>
      <div class="f"><input id="reasonNote" placeholder="รายละเอียดเพิ่มเติม (ไม่บังคับ)"></div>
    </div>

    <div class="hint">• ล็อตที่หมดอายุแล้วจะไม่ถูกตัดขาย / ล็อตที่ไม่ใส่วันหมดอายุจะถูกตัดขายทีหลังสุด<br>
      • การปรับจำนวนทุกครั้งเก็บประวัติไว้ในชีต "ปรับสต๊อก (StockAdjustments)" (จำนวนเดิม → ใหม่, ผู้ปรับ, เหตุผล)</div>

    <div class="actions"><span class="status" id="status"></span><button class="save-btn" id="saveBtn" onclick="save()">💾 บันทึกการปรับสต๊อก</button></div>
  `;
  updTotals();
}

function mark(el, i, kind) { const l = lots[i]; if (!l.isNew) el.classList.toggle('changed', l.lotNo !== l.oldLot); }
function updRow(i) {
  const l = lots[i];
  const diff = (l.qty === '' ? 0 : Number(l.qty)) - l.oldQty;
  document.getElementById('qeq' + i).innerHTML = `${diff ? `<span class="diff ${diff > 0 ? 'up' : 'down'}">${diff > 0 ? '+' : ''}${fmtQ(diff)}</span> ` : ''}${qtyEq(Number(l.qty) || 0)}`;
  document.getElementById('ceq' + i).innerHTML = bigUnitEq(Number(l.cost));
  updTotals();
}
function updTotals() {
  const sellable = lots.reduce((s, l) => s + ((l.exp && l.exp < todayStr) ? 0 : (Number(l.qty) || 0)), 0);
  const oldTotal = lots.reduce((s, l) => s + l.oldQty, 0);
  const newTotal = lots.reduce((s, l) => s + (Number(l.qty) || 0), 0);
  const value = lots.reduce((s, l) => s + (Number(l.qty) || 0) * (Number(l.cost) || 0), 0);
  const el = document.getElementById('totals');
  if (el) el.innerHTML = `<span>รวมเดิม <b>${fmtQ(oldTotal)}</b> ${esc(prod.small)}</span><span>รวมใหม่ <b>${fmtQ(newTotal)}</b> ${esc(prod.small)} ${qtyEq(newTotal)}</span><span>ขายได้ (ไม่รวมหมดอายุ) <b>${fmtQ(sellable)}</b></span><span>มูลค่าทุนรวม <b>${fmt(value)}</b> บาท</span>`;
}

async function save() {
  if (!prod) return;
  for (const l of lots) {
    if (l.isNew && Number(l.qty) > 0 && !l.exp && !confirm('มีล็อตใหม่ที่ยังไม่ใส่วันหมดอายุ — ล็อตนี้จะถูกตัดขายทีหลังสุด\nบันทึกต่อเลยไหม?')) return;
    if (l.qty === '' && !l.isNew) { alert('กรุณาใส่จำนวนใหม่ให้ครบทุกล็อต (ถ้าหมดแล้วใส่ 0)'); return; }
  }
  const changedLots = lots.filter(l => l.isNew ? Number(l.qty) > 0
    : (Number(l.qty) !== l.oldQty || Number(l.cost) !== l.oldCost || l.exp !== l.oldExp || l.lotNo !== l.oldLot));
  const priceChanges = prod.prices.filter(p => p.price !== '' && Number(p.price) !== Number(p.old));
  let costChanged = prod.newLatestCost !== '' && Number(prod.newLatestCost) !== prod.latestCost;
  // ไม่ได้แก้ต้นทุนล่าสุดเอง แต่เพิ่มล็อตใหม่พร้อมทุน → ใช้ทุนของล็อตใหม่ล่าสุดเป็นต้นทุนล่าสุด (เหมือนการรับของ)
  const newWithCost = lots.filter(l => l.isNew && Number(l.qty) > 0 && Number(l.cost) > 0);
  if (!costChanged && newWithCost.length && Number(newWithCost[newWithCost.length - 1].cost) !== prod.latestCost) {
    prod.newLatestCost = Number(newWithCost[newWithCost.length - 1].cost);
    costChanged = true;
  }
  if (!changedLots.length && !priceChanges.length && !costChanged) { alert('ยังไม่ได้แก้อะไร'); return; }

  const reason = document.getElementById('reason').value + (document.getElementById('reasonNote').value.trim() ? ' — ' + document.getElementById('reasonNote').value.trim() : '');
  let userId = '';
  try { const u = JSON.parse(localStorage.getItem('ppms_user') || 'null'); userId = u ? (u['Username'] || u['ชื่อ-นามสกุล'] || u.name || '') : ''; } catch (e) {}

  const btn = document.getElementById('saveBtn');
  btn.disabled = true; btn.textContent = '⏳ กำลังบันทึก...';
  try {
    const r = await apiPost('adjustStock', { code: prod.code, adjust: {
      lots: changedLots.map(l => ({ row: l.row, lotNo: l.lotNo.trim(), exp: l.exp, qty: Number(l.qty) || 0, cost: Number(l.cost) || 0 })),
      latestCost: costChanged ? Number(prod.newLatestCost) : '',
      prices: priceChanges.map(p => ({ unit: p.unit, price: Number(p.price) })),
      reason, userId,
    } });
    const code = prod.code;
    await pick(code);
    document.getElementById('status').textContent = `✅ บันทึกแล้ว — ปรับ ${r.changedLots} ล็อต${r.changedPrices ? ', ราคาขาย ' + r.changedPrices + ' หน่วย' : ''}${costChanged ? ', ต้นทุนล่าสุด' : ''}`;
  } catch (err) {
    alert('บันทึกไม่สำเร็จ: ' + err.message);
    btn.disabled = false; btn.textContent = '💾 บันทึกการปรับสต๊อก';
  }
}

const urlCode = new URLSearchParams(location.search).get('code');
if (urlCode) pick(urlCode); else q.focus();
</script>
</body>
</html>

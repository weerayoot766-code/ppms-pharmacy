<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปรุงยาเภสัช - จัดการกลุ่มสินค้า (มอคอัพ)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Sarabun', 'Segoe UI', Arial, sans-serif;
    background: #dff3e3;
    margin: 0;
    color: #24312a;
  }

  .topbar {
    background: linear-gradient(90deg, #1e6b3c, #2e8b4f);
    color: #fff;
    padding: 14px 26px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar .logo-badge {
    width: 32px; height: 32px;
    border-radius: 8px;
    background: rgba(255,255,255,.18);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; cursor: pointer;
  }
  .topbar .titles { line-height: 1.25; cursor: pointer; }
  .topbar .titles .th-name { font-size: 16px; font-weight: 700; }
  .topbar .titles .en-name { font-size: 11px; letter-spacing: .04em; opacity: .85; }
  .back-link {
    margin-left: auto;
    background: rgba(255,255,255,.16);
    border: 1px solid rgba(255,255,255,.5);
    color: #fff;
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
  }
  .back-link:hover { background: rgba(255,255,255,.28); }

  .breadcrumb {
    background: #fff;
    padding: 11px 22px;
    font-size: 13px;
    color: #6b7a70;
    border-bottom: 1px solid #eef2ef;
  }
  .breadcrumb b { color: #1e6b3c; }
  .breadcrumb .sep { margin: 0 6px; color: #b6c4bb; }

  .content { max-width: 950px; margin: 0 auto; padding: 24px 22px 60px; }

  .panel {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 2px 8px rgba(30, 90, 50, .06);
    overflow: hidden;
  }

  .panel-header {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px 22px;
    border-bottom: 1px solid #eef2ef;
    flex-wrap: wrap;
  }
  .panel-header h2 {
    font-size: 16px; font-weight: 700; color: #1e6b3c; margin: 0;
    display: flex; align-items: center; gap: 8px;
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    display: flex;
    border: 1px solid #cfe0d3;
    border-radius: 8px;
    overflow: hidden;
  }
  .search-box input {
    flex: 1; border: none; padding: 10px 12px; font-size: 14px; font-family: inherit;
  }
  .search-box button {
    background: #eef6ee; border: none; padding: 0 16px; cursor: pointer; color: #2e8b4f; font-size: 15px;
  }
  .add-btn {
    background: #2e8b4f;
    color: #fff;
    border: none;
    border-radius: 8px;
    padding: 11px 18px;
    font-size: 13.5px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .add-btn:hover { background: #257a43; }

  .result-count { padding: 12px 22px 0; font-size: 12.5px; color: #6b7a70; }

  table.group-table { width: 100%; border-collapse: collapse; }
  table.group-table th {
    text-align: left; font-size: 12.5px; color: #6b7a70; font-weight: 600;
    border-bottom: 2px solid #2e8b4f; padding: 10px 14px; white-space: nowrap;
  }
  table.group-table td {
    padding: 12px 14px; border-bottom: 1px solid #eef2ef; font-size: 13.5px; vertical-align: middle;
  }
  table.group-table tr:hover td { background: #f6faf7; }
  .group-name { font-weight: 600; color: #24312a; }
  .count-pill {
    display: inline-block; background: #eef6ee; color: #1e6b3c; font-weight: 600;
    font-size: 12.5px; padding: 3px 10px; border-radius: 20px;
  }

  .action-btns { display: flex; gap: 6px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid #cfe0d3; background: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: #4a5a4f;
  }
  .icon-btn:hover { background: #eef6ee; border-color: #2e8b4f; color: #1e6b3c; }
  .icon-btn.danger:hover { background: #fdecea; border-color: #f2544a; color: #d9433a; }

  .empty-state { padding: 40px; text-align: center; color: #8fa198; font-size: 13.5px; }

  /* ---------- Popup เพิ่มกลุ่มสินค้า ---------- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(20,40,28,.45);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.show { display: flex; }
  .modal-card {
    background: #fff; border-radius: 14px; width: 100%; max-width: 380px;
    box-shadow: 0 12px 34px rgba(20,60,35,.25);
  }
  .modal-header {
    background: #eaf7ec; border-bottom: 1px solid #d3ecd8; border-radius: 14px 14px 0 0;
    padding: 16px 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .modal-title { font-size: 16px; font-weight: 700; color: #1e6b3c; }
  .modal-close { background: none; border: none; font-size: 16px; color: #6b7a70; cursor: pointer; width: 28px; height: 28px; border-radius: 50%; }
  .modal-close:hover { background: #dcefe0; color: #2c3a32; }
  .modal-body { padding: 18px; }
  .modal-body label { display: block; font-size: 12.5px; font-weight: 600; color: #3f4f45; margin-bottom: 7px; }
  .modal-body input {
    width: 100%; padding: 10px 12px; border: 1px solid #cfe0d3; border-radius: 8px; font-size: 14px; font-family: inherit;
  }
  .modal-confirm-btn {
    width: 100%; margin-top: 18px; background: #2e8b4f; color: #fff; border: none;
    border-radius: 10px; padding: 12px; font-size: 14.5px; font-weight: 600; cursor: pointer;
  }
  .modal-confirm-btn:hover { background: #257a43; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo-badge" onclick="window.location.href='backoffice-mockup.html'">💊</div>
  <div class="titles" onclick="window.location.href='backoffice-mockup.html'">
    <div class="th-name">ปรุงยาเภสัช — ระบบหลังบ้าน</div>
    <div class="en-name">Prungya Pharmacy and Medical System (PPMS)</div>
  </div>
  <button class="back-link" onclick="window.location.href='backoffice-mockup.html'">← กลับหน้าหลังบ้าน</button>
</div>

<div class="breadcrumb">
  หน้าหลัก <span class="sep">/</span> ข้อมูลสินค้า <span class="sep">/</span> <b>จัดการกลุ่มสินค้า</b>
</div>

<div class="content">
  <div class="panel">
    <div class="panel-header">
      <h2>🏷️ จัดการกลุ่มสินค้า</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ค้นหาชื่อกลุ่มสินค้า...">
        <button onclick="doSearch()">🔍</button>
      </div>
      <button class="add-btn" onclick="openAddModal()">＋ เพิ่มกลุ่มสินค้า</button>
    </div>

    <div class="result-count" id="resultCount"></div>

    <table class="group-table">
      <thead>
        <tr>
          <th style="width:50px;">#</th>
          <th>ชื่อกลุ่มสินค้า</th>
          <th style="width:140px;">จำนวนสินค้า</th>
          <th style="width:100px;">Action</th>
        </tr>
      </thead>
      <tbody id="groupBody"></tbody>
    </table>
  </div>
</div>

<!-- ========== Popup เพิ่มกลุ่มสินค้า ========== -->
<div class="modal-overlay" id="addModalOverlay">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title">เพิ่มกลุ่มสินค้าใหม่</div>
      <button class="modal-close" onclick="closeAddModal()">✕</button>
    </div>
    <div class="modal-body">
      <label>ชื่อกลุ่มสินค้า</label>
      <input type="text" id="newGroupName" placeholder="เช่น ผลิตภัณฑ์ผู้สูงอายุ">
      <button class="modal-confirm-btn" onclick="confirmAddGroup()">＋ เพิ่มกลุ่มสินค้า</button>
    </div>
  </div>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxfglKSQrUlsmroFU2e8GGA2xA5qEpKGazPNAX6yor2lJH5Xgt5b2Lo1EQIb-nNOJejmA/exec';

async function apiGet(action, params = {}) {
  const query = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(`${API_URL}?${query}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/**
 * อ่านผลตอบกลับจาก Apps Script อย่างปลอดภัย
 * บางครั้ง Google ตอบกลับเป็นหน้า HTML (<!DOCTYPE ...) แทน JSON ทั้งที่สคริปต์ทำงานเสร็จไปแล้ว
 * ถ้าเจอแบบนั้นจะโยน error ที่มี flag nonJson = true ให้ผู้เรียกตัดสินใจเองว่าจะลองใหม่/ตรวจสอบซ้ำอย่างไร
 */
async function readApiJson(res) {
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    const err = new Error('เซิร์ฟเวอร์ Google ตอบกลับผิดรูปแบบชั่วคราว (ไม่ใช่ข้อมูล JSON)');
    err.nonJson = true;
    throw err;
  }
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/**
 * บันทึกข้อมูล (POST) — แนบรหัสคำขอ (requestId) ไปด้วยทุกครั้ง
 * ถ้า Google ตอบกลับเป็นหน้า HTML (ทั้งที่หลังบ้านบันทึกสำเร็จแล้ว) จะไปถามผลจริงด้วยรหัสนั้นผ่าน GET แทน
 * หลังบ้านจำผลของรหัสนี้ไว้ ถ้าคำขอเดิมถูกส่งซ้ำจะไม่ทำงานซ้ำ (กันบันทึกซ้ำ/ตัดสต๊อกซ้ำ)
 */
async function apiPost(action, payload = {}) {
  const requestId = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, requestId, ...payload }), // ห้ามตั้ง Content-Type เอง ไม่งั้นชน CORS preflight
    });
    return await readApiJson(res);
  } catch (err) {
    if (!err.nonJson && !(err instanceof TypeError)) throw err; // error จริงจากหลังบ้าน → แจ้งตามปกติ
    for (let attempt = 1; attempt <= 4; attempt++) {
      await new Promise(r => setTimeout(r, 700 * attempt));
      let r;
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        r = await readApiJson(await fetch(`${API_URL}?${q}`));
      } catch (e) { continue; }
      if (r && r.found) {
        if (!r.response.ok) throw new Error(r.response.error);
        return r.response.data;
      }
    }
    throw err;
  }
}

// ---------- ผู้ใช้งานที่ล็อกอินอยู่ ----------
(function () {
  if (!localStorage.getItem('ppms_user')) {
    window.location.href = 'login-mockup.html';
  }
})();

// ================= กลุ่มสินค้าจริง: โหลดจาก action 'listProductGroups' =================
// หมายเหตุ: count จำนวนสินค้าคำนวณจากคอลัมน์ 'กลุ่มสินค้า 1-4' ในชีตสินค้าจริง
// สินค้าส่วนใหญ่ยังไม่ได้ระบุกลุ่มไว้ในชีต จึง count มักจะเป็น 0 ในตอนนี้ (ไม่ใช่บั๊ก)
let groups = [];

async function loadGroups() {
  document.getElementById('groupBody').innerHTML =
    `<tr><td colspan="4"><div class="empty-state">กำลังโหลดข้อมูลจริง...</div></td></tr>`;
  try {
    groups = await apiGet('listProductGroups');
  } catch (err) {
    document.getElementById('groupBody').innerHTML =
      `<tr><td colspan="4"><div class="empty-state">ดึงข้อมูลไม่สำเร็จ: ${err.message}</div></td></tr>`;
    return;
  }
  doSearch();
}

let filtered = groups;

function renderTable() {
  const body = document.getElementById('groupBody');
  if (filtered.length === 0) {
    body.innerHTML = `<tr><td colspan="4"><div class="empty-state">ไม่พบกลุ่มสินค้าที่ค้นหา</div></td></tr>`;
  } else {
    body.innerHTML = filtered.map((g, i) => `
      <tr>
        <td>${i + 1}</td>
        <td class="group-name">${g.name}</td>
        <td><span class="count-pill">${g.count.toLocaleString()} รายการ</span></td>
        <td>
          <div class="action-btns">
            <button class="icon-btn" title="แก้ไข" onclick="alert('มอคอัพ: จะแก้ไขชื่อกลุ่ม ${g.name}')">✏️</button>
            <button class="icon-btn danger" title="ลบ" onclick="deleteGroup('${g.name}')">🗑️</button>
          </div>
        </td>
      </tr>
    `).join("");
  }
  document.getElementById('resultCount').textContent = `ทั้งหมด ${filtered.length} กลุ่ม`;
}

function doSearch() {
  const kw = document.getElementById('searchInput').value.trim().toLowerCase();
  filtered = kw === "" ? groups : groups.filter(g => g.name.toLowerCase().includes(kw));
  renderTable();
}

async function deleteGroup(name) {
  if (!confirm(`ลบกลุ่มสินค้า "${name}" ใช่หรือไม่?`)) return;
  try {
    await apiPost('deleteProductGroup', { name });
    groups = groups.filter(g => g.name !== name);
    doSearch();
  } catch (err) {
    alert('ลบไม่สำเร็จ: ' + err.message);
  }
}

function openAddModal() {
  document.getElementById('newGroupName').value = "";
  document.getElementById('addModalOverlay').classList.add('show');
}
function closeAddModal() {
  document.getElementById('addModalOverlay').classList.remove('show');
}
async function confirmAddGroup() {
  const name = document.getElementById('newGroupName').value.trim();
  if (!name) { alert('กรุณาพิมพ์ชื่อกลุ่มสินค้า'); return; }
  try {
    await apiPost('createProductGroup', { name });
    groups.push({ name, count: 0 });
    closeAddModal();
    doSearch();
  } catch (err) {
    alert('เพิ่มไม่สำเร็จ: ' + err.message);
  }
}

document.getElementById('searchInput').addEventListener('input', doSearch);
document.getElementById('searchInput').addEventListener('keyup', e => { if (e.key === 'Enter') doSearch(); });

loadGroups();
</script>

</body>
</html>

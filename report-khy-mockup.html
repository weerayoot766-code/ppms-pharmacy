const API_URL = 'https://script.google.com/macros/s/AKfycbxfglKSQrUlsmroFU2e8GGA2xA5qEpKGazPNAX6yor2lJH5Xgt5b2Lo1EQIb-nNOJejmA/exec';

/**
 * อ่านผลตอบกลับจาก Apps Script อย่างปลอดภัย
 * บางครั้ง Google ตอบกลับเป็นหน้า HTML (<!DOCTYPE ...) แทน JSON ชั่วคราว ทั้งที่สคริปต์ทำงานเสร็จไปแล้ว
 * ถ้าเจอแบบนั้นจะโยน error ที่มี flag nonJson = true ให้ผู้เรียกตัดสินใจเองว่าจะลองใหม่/ตรวจสอบซ้ำอย่างไร
 */
async function readApiJson(res) {
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    const err = new Error('เซิร์ฟเวอร์ Google ตอบกลับผิดรูปแบบชั่วคราว (ไม่ใช่ข้อมูล JSON)');
    err.nonJson = true;
    throw err;
  }
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/**
 * ดึงข้อมูล (GET) — แนบรหัสคำขอ (requestId) ไปด้วย
 * บางครั้งสคริปต์ทำงานเสร็จแล้ว แต่ตอนรับผล Google ตอบ 404 (script.googleusercontent.com) แทนผลลัพธ์
 * ถ้าเจอ: ถามผลจริงด้วยรหัสเดิมก่อน (เร็ว) ถ้ายังไม่ได้ค่อยส่งใหม่ด้วยรหัสเดิม — หลังบ้านจำผลไว้ จึงตอบได้ทันทีไม่ต้องทำงานซ้ำ
 */
async function apiGet(action, params = {}) {
  const requestId = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const query = new URLSearchParams({ action, ...params, requestId }).toString();
  for (let attempt = 1; ; attempt++) {
    try {
      const res = await fetch(`${API_URL}?${query}`);
      return await readApiJson(res);
    } catch (err) {
      const transient = err.nonJson || err instanceof TypeError;
      if (!transient || attempt >= 4) throw err;
      console.warn('[PPMS] Google ตอบกลับผิดพลาด (' + action + ') กำลังกู้คืนครั้งที่ ' + attempt);
      await new Promise(r => setTimeout(r, 250));
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        const r = await readApiJson(await fetch(`${API_URL}?${q}`));
        if (r && r.found) {
          if (!r.response.ok) throw new Error(r.response.error);
          return r.response.data;
        }
      } catch (e2) { if (!e2.nonJson && !(e2 instanceof TypeError)) throw e2; }
      // ยังไม่ได้ผล → วนส่งคำขอเดิมใหม่ทันที (ไม่ต้องรอนาน)
    }
  }
}

function renderKhy9List() {
  const q = (document.getElementById('khy9Search').value || '').trim().toLowerCase();
  const list = khy9Products.filter(p => !q || p.code.toLowerCase().includes(q) || p.name.toLowerCase().includes(q));
  const body = document.getElementById('khy9ListBody');
  if (!list.length) {
    body.innerHTML = `<tr><td colspan="3"><div class="empty-state">ไม่พบสินค้าที่ค้นหา</div></td></tr>`;
  } else {
    body.innerHTML = list.map((p, i) => `
      <tr>
        <td>${i + 1}</td>
        <td class="code-link">${p.code}</td>
        <td>${p.name}</td>
      </tr>
    `).join('');
  }
}

async function renderKhy9Doc() {
  document.getElementById('docPanelTitle').textContent = 'ตัวอย่างเอกสารสำหรับพิมพ์ — บัญชีการซื้อยา (แบบ ขย.9)';
  const branch = document.getElementById('branch').value;
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;

  document.getElementById('docPreviewArea').innerHTML = '<div class="doc-preview"><div class="empty-state">กำลังโหลดข้อมูลจริง...</div></div>';

  let data;
  try {
    data = await apiGet('getKhy9Report', { branch, dateFrom: from, dateTo: to });
  } catch (err) {
    document.getElementById('docPreviewArea').innerHTML = `<div class="doc-preview"><div class="empty-state">ดึงข้อมูลไม่สำเร็จ: ${err.message}</div></div>`;
    return;
  }

  const rows = data.map((r, i) => `
    <tr>
      <td>${i + 1}</td>
      <td>${r.date}</td>
      <td class="left">${r.seller}</td>
      <td class="left">${r.drugName}</td>
      <td>${r.lotNo}</td>
      <td>${r.qty}</td>
      <td>${r.pharmacist || ''}</td>
      <td></td>
    </tr>
  `).join('');

  document.getElementById('docPreviewArea').innerHTML = `
    <div class="doc-preview">
      <div class="doc-form-code">แบบ ขย.๙</div>
      <div class="doc-header">
        <div class="doc-title">บัญชีการซื้อยา</div>
        <div class="doc-sub">ปรุงยาเภสัช</div>
        <div class="doc-sub">${branch}</div>
        <div class="doc-range">ระหว่างวันที่ ${from} - ${to}</div>
      </div>
      <table class="doc-table">
        <thead>
          <tr>
            <th style="width:60px;">ลำดับที่</th>
            <th style="width:100px;">วัน เดือน ปี<br>ที่ซื้อ</th>
            <th>ชื่อผู้ขาย</th>
            <th>ชื่อยา</th>
            <th style="width:120px;">เลขที่หรืออักษร<br>ของครั้งที่ผลิต</th>
            <th style="width:90px;">จำนวน/<br>ปริมาณ</th>
            <th style="width:150px;">ลายมือชื่อ<br>ผู้มีหน้าที่ปฏิบัติการ</th>
            <th style="width:90px;">หมายเหตุ</th>
          </tr>
        </thead>
        <tbody>${rows.length ? rows : '<tr><td colspan="8" class="empty-state">ไม่พบรายการซื้อยาที่ต้องรายงาน ขย.9 ในช่วงวันที่นี้</td></tr>'}</tbody>
      </table>
    </div>
  `;
}

function populateKhy11Select() {
  const sel = document.getElementById('khy11Select');
  sel.innerHTML = khy11Drugs.map(d => `<option value="${d.code}">${d.code} : ${d.name}</option>`).join('');
}

function onReportChange() {
  const type = document.getElementById('reportType').value;
  document.getElementById('khy9ListPanel').style.display = type === 'khy9' ? 'block' : 'none';
  document.getElementById('khy11PickPanel').style.display = type === 'khy11' ? 'block' : 'none';
  renderReport();
}

function renderReport() {
  const type = document.getElementById('reportType').value;
  if (type === 'khy9') {
    renderKhy9List();
    renderKhy9Doc(); // async — ทำงานเองในเบื้องหลัง ไม่ต้องรอ
  } else {
    renderKhy11Doc();
  }
}

populateKhy11Select();
renderKhy9List();
renderReport();
</script>

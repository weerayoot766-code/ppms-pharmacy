<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<!-- ไอคอนแอปบนหน้าจอโฮม (เพิ่มลงหน้าจอโฮม / ติดตั้งแอป) -->
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#1e6b3c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ปรุงยาเภสัช">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปรุงยาเภสัช - เข้าสู่ระบบ (มอคอัพ)</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    height: 100%; margin: 0;
    font-family: 'Sarabun', 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(160deg, #1e6b3c 0%, #2e8b4f 45%, #6fbf8a 100%);
  }
  body {
    display: flex; align-items: center; justify-content: center; padding: 20px;
  }

  .login-card {
    background: #fff;
    border-radius: 18px;
    box-shadow: 0 20px 60px rgba(10,40,20,.35);
    width: 100%; max-width: 380px;
    padding: 38px 34px 30px;
  }
  .logo-circle {
    width: 68px; height: 68px; border-radius: 50%;
    background: linear-gradient(135deg, #1e6b3c, #2e8b4f);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px; margin: 0 auto 14px;
    box-shadow: 0 6px 18px rgba(30,107,60,.35);
  }
  .shop-name { text-align: center; font-size: 19px; font-weight: 700; color: #1e6b3c; }
  .shop-sub { text-align: center; font-size: 12px; color: #8fa198; margin-top: 2px; margin-bottom: 26px; }

  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12.5px; font-weight: 600; color: #3f4f45; margin-bottom: 6px; }
  .input-wrap { position: relative; }
  .input-wrap .ic { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); font-size: 15px; opacity: .55; }
  .field input {
    width: 100%; padding: 11px 12px 11px 36px; border: 1px solid #cfe0d3; border-radius: 9px;
    font-size: 14px; font-family: inherit; color: #24312a;
  }
  .field input:focus { outline: none; border-color: #2e8b4f; box-shadow: 0 0 0 3px rgba(46,139,79,.12); }

  .row-between { display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; font-size: 12.5px; }
  .remember { display: flex; align-items: center; gap: 6px; color: #4a5a4f; }
  .forgot-link { color: #2e8b4f; font-weight: 600; text-decoration: none; cursor: pointer; }
  .forgot-link:hover { text-decoration: underline; }

  .login-btn {
    width: 100%; background: #2e8b4f; color: #fff; border: none; border-radius: 9px;
    padding: 12px; font-size: 15px; font-weight: 700; cursor: pointer;
  }
  .login-btn:hover { background: #257a43; }

  .error-box {
    display: none; background: #fbe4e2; color: #c0392b; border: 1px solid #f0c9c4;
    border-radius: 8px; padding: 10px 12px; font-size: 13px; margin-bottom: 16px;
  }
  .error-box.show { display: block; }

  .demo-hint {
    margin-top: 18px; text-align: center; font-size: 11.5px; color: #a9b5ae;
    line-height: 1.6;
  }
  .demo-hint b { color: #6b7a70; }

  .login-btn:disabled { opacity: .65; cursor: not-allowed; }
</style>
</head>
<body>

<div class="login-card">
  <img src="icons/logo-full.png" alt="PPMS ปรุงยาเภสัช" style="display:block;width:170px;height:170px;margin:-10px auto 4px;">
  <div class="shop-sub">Prungya Pharmacy and Medical System (PPMS)</div>

  <div class="error-box" id="errorBox">ชื่อผู้ใช้งานหรือ PIN ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง</div>

  <div class="field">
    <label>ชื่อผู้ใช้งาน</label>
    <div class="input-wrap">
      <span class="ic">👤</span>
      <input type="text" id="username" placeholder="ชื่อผู้ใช้งาน หรือ เบอร์โทรศัพท์" autocapitalize="off" autocorrect="off" spellcheck="false">
    </div>
  </div>

  <div class="field">
    <label>PIN</label>
    <div class="input-wrap">
      <span class="ic">🔒</span>
      <input type="password" id="pin" inputmode="numeric" maxlength="6" placeholder="กรอก PIN 4-6 หลัก" onkeydown="if(event.key==='Enter') doLogin()">
    </div>
  </div>

  <div class="row-between">
    <label class="remember">
      <input type="checkbox" id="remember"> จดจำฉันไว้
    </label>
    <a class="forgot-link" onclick="alert('มอคอัพ: จะให้แอดมินช่วยตั้ง PIN ใหม่ให้ที่หน้าจัดการผู้ใช้งาน')">ลืม PIN?</a>
  </div>

  <button class="login-btn" onclick="doLogin()">เข้าสู่ระบบ</button>
</div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxfglKSQrUlsmroFU2e8GGA2xA5qEpKGazPNAX6yor2lJH5Xgt5b2Lo1EQIb-nNOJejmA/exec';

/**
 * อ่านผลตอบกลับจาก Apps Script อย่างปลอดภัย
 * บางครั้ง Google ตอบกลับเป็นหน้า HTML (<!DOCTYPE ...) แทน JSON ชั่วคราว ทั้งที่สคริปต์ทำงานเสร็จไปแล้ว
 * ถ้าเจอแบบนั้นจะโยน error ที่มี flag nonJson = true ให้ผู้เรียกตัดสินใจเองว่าจะลองใหม่/ตรวจสอบซ้ำอย่างไร
 */
async function readApiJson(res) {
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    const err = new Error('เซิร์ฟเวอร์ Google ตอบกลับผิดรูปแบบชั่วคราว (ไม่ใช่ข้อมูล JSON)');
    err.nonJson = true;
    throw err;
  }
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/**
 * ดึงข้อมูล (GET) — แนบรหัสคำขอ (requestId) ไปด้วย
 * บางครั้งสคริปต์ทำงานเสร็จแล้ว แต่ตอนรับผล Google ตอบ 404 (script.googleusercontent.com) แทนผลลัพธ์
 * ถ้าเจอ: ถามผลจริงด้วยรหัสเดิมก่อน (เร็ว) ถ้ายังไม่ได้ค่อยส่งใหม่ด้วยรหัสเดิม — หลังบ้านจำผลไว้ จึงตอบได้ทันทีไม่ต้องทำงานซ้ำ
 */
async function apiGet(action, params = {}) {
  const requestId = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const query = new URLSearchParams({ action, ...params, requestId }).toString();
  for (let attempt = 1; ; attempt++) {
    try {
      const res = await fetch(`${API_URL}?${query}`);
      return await readApiJson(res);
    } catch (err) {
      const transient = err.nonJson || err instanceof TypeError;
      if (!transient || attempt >= 4) throw err;
      console.warn('[PPMS] Google ตอบกลับผิดพลาด (' + action + ') กำลังกู้คืนครั้งที่ ' + attempt);
      await new Promise(r => setTimeout(r, 250));
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        const r = await readApiJson(await fetch(`${API_URL}?${q}`));
        if (r && r.found) {
          if (!r.response.ok) throw new Error(r.response.error);
          return r.response.data;
        }
      } catch (e2) { if (!e2.nonJson && !(e2 instanceof TypeError)) throw e2; }
      // ยังไม่ได้ผล → วนส่งคำขอเดิมใหม่ทันที (ไม่ต้องรอนาน)
    }
  }
}


async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const pin = document.getElementById('pin').value.trim();
  const errorBox = document.getElementById('errorBox');
  const btn = document.querySelector('.login-btn');

  if (!username || !pin) {
    errorBox.textContent = 'กรุณากรอกชื่อผู้ใช้งานและ PIN ให้ครบ';
    errorBox.classList.add('show');
    return;
  }

  errorBox.classList.remove('show');
  btn.disabled = true;
  btn.textContent = 'กำลังตรวจสอบ...';

  try {
    const user = await apiGet('login', { username, pin });
    // เก็บข้อมูลผู้ใช้ที่ล็อกอินไว้ใช้ทั่วระบบ (เช่น แสดงชื่อในหน้า POS, บันทึกเป็นผู้ขายในบิล)
    localStorage.setItem('ppms_user', JSON.stringify(user));
    if (document.getElementById('remember').checked) {
      localStorage.setItem('ppms_remember_username', username);
    }
    window.location.href = 'backoffice-mockup.html';
  } catch (err) {
    errorBox.textContent = err.message || 'ชื่อผู้ใช้งานหรือ PIN ไม่ถูกต้อง กรุณาลองใหม่อีกครั้ง';
    errorBox.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'เข้าสู่ระบบ';
  }
}

// จำชื่อผู้ใช้งานล่าสุดไว้ให้ ถ้าเคยติ๊ก "จดจำฉันไว้"
const rememberedUsername = localStorage.getItem('ppms_remember_username');
if (rememberedUsername) {
  document.getElementById('username').value = rememberedUsername;
  document.getElementById('remember').checked = true;
}
</script>

</body>
</html>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxfglKSQrUlsmroFU2e8GGA2xA5qEpKGazPNAX6yor2lJH5Xgt5b2Lo1EQIb-nNOJejmA/exec';

async function apiGet(action, params = {}) {
  const query = new URLSearchParams({ action, ...params }).toString();
  const res = await fetch(`${API_URL}?${query}`);
  const json = await res.json();
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

// ---------- ผู้ใช้งานที่ล็อกอินอยู่ ----------
(function () {
  if (!localStorage.getItem('ppms_user')) {
    window.location.href = 'login-mockup.html';
  }
})();

// แคชไว้ไม่ให้ยิง API ซ้ำทุกครั้งที่สลับแท็บ — โหลดครั้งแรกครั้งเดียวต่อประเภทรายงาน
const salesDataLoaded = { daily: false, product: false };

/** โหลดรายงานยอดขายจริงจาก action 'getSalesReport' (รองรับ type: 'daily' และ 'product' เท่านั้น) */
async function loadSalesData(type) {
  const branch = document.getElementById('branch').value;
  let dateFrom, dateTo;

  if (type === 'daily') {
    // รายงานรายวันใช้ตัวเลือกเดือน/ปี ไม่ใช่ dateFrom/dateTo — คำนวณช่วงวันที่ทั้งเดือนแทน
    const monthNames = ["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
    const monthIdx = monthNames.indexOf(document.getElementById('month').value);
    const year = Number(document.getElementById('year').value);
    const firstDay = new Date(year, monthIdx, 1);
    const lastDay = new Date(year, monthIdx + 1, 0);
    const toStr = d => d.toISOString().slice(0, 10);
    dateFrom = toStr(firstDay);
    dateTo = toStr(lastDay);
  } else {
    dateFrom = document.getElementById('dateFrom').value;
    dateTo = document.getElementById('dateTo').value;
  }

  const rows = await apiGet('getSalesReport', { type, branch, dateFrom, dateTo });
  reportData[type].rows = rows;
  salesDataLoaded[type] = true;
}

const reportTypes = [
  { id:"daily",     label:"รายงานสรุปยอดขายแต่ละวัน" },
  { id:"product",   label:"รายงานสรุปการขายสินค้า" },
  { id:"profitProduct", label:"รายงานกำไร-ขาดทุน/สินค้า" },
  { id:"profitBill", label:"รายงานกำไร-ขาดทุน/บิล" },
  { id:"bundle",    label:"รายงานการขายสินค้าชุด" },
  { id:"productGroup", label:"รายงานการขายกลุ่มสินค้า" },
  { id:"customer",  label:"รายงานประวัติการซื้อสินค้ารายตัวของลูกค้า" },
  { id:"itemProfit",label:"รายงานการขายสินค้ารายตัวและกำไรขั้นต้น" },
];

const sel = document.getElementById('reportType');
reportTypes.forEach(r => {
  const opt = document.createElement('option');
  opt.value = r.id; opt.textContent = r.label;
  sel.appendChild(opt);
});

    filterMode: "range",

    rows: [
      [1,"PCU00435","Ibucet 725 mg รีส้ม บันเม็ด",10,0,"TAB",4.00,1.10,2.90,40.00,0.00,11.00,29.00],
      [2,"PCU00392","Prospa 535 mg รีม่วง (1x3)",10,0,"TAB",2.00,0.68,1.32,20.00,0.00,6.80,13.20],

    summary: () => `ยอดขายทั้งหมด <b>${fmt(5210)}</b> บาท &nbsp;•&nbsp; ยอดคืนทั้งหมด <b>${fmt(0)}</b> บาท &nbsp;•&nbsp; ต้นทุนรวม <b>${fmt(2407.83)}</b> บาท &nbsp;•&nbsp; กำไรขั้นต้น <b>${fmt(2802.17)}</b> บาท`,
  },
  profitBill: {
    purpose: "จุดประสงค์รายงานกำไร-ขาดทุน/บิล : รายงานสำหรับแสดงกำไรขั้นต้นจากการขายในบิลนั้น ในกรณีที่มีการตั้งค่าภาษีขายหรือมีส่วนลดจากการขายในบิลก็จะนำมาคิดในยอดขายด้วย (⚠️ ยังไม่เชื่อมข้อมูลจริง — backend ยังไม่มี action รองรับ ตัวอย่างด้านล่างเป็นข้อมูลจำลอง)",

async function onReportChange() {
  const type = sel.value;
  const cfg = reportData[type];
  window._bundleSelectValue = '';

  document.getElementById('monthField').style.display = cfg.filterMode === 'month' ? 'flex' : 'none';
  document.getElementById('yearField').style.display = cfg.filterMode === 'month' ? 'flex' : 'none';
  document.getElementById('fromField').style.display = cfg.filterMode === 'range' ? 'flex' : 'none';
  document.getElementById('toField').style.display = cfg.filterMode === 'range' ? 'flex' : 'none';
  document.getElementById('payTypeField').style.display = cfg.extraFilter === 'payType' ? 'flex' : 'none';

  if (type === 'daily' || type === 'product') {
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="1">กำลังโหลดข้อมูลจริง...</td></tr>`;
    try {
      await loadSalesData(type);
    } catch (err) {
      document.getElementById('tableBody').innerHTML = `<tr><td colspan="1">ดึงข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
      return;
    }
  }

  renderReport();
}

async function viewReport() {
  const type = sel.value;
  if (type === 'daily' || type === 'product') {
    document.getElementById('tableBody').innerHTML = `<tr><td colspan="1">กำลังโหลดข้อมูลจริง...</td></tr>`;
    try {
      await loadSalesData(type); // ยิงใหม่ทุกครั้งที่กด "ดูรายงาน" เผื่อเปลี่ยนช่วงวันที่/สาขา
    } catch (err) {
      document.getElementById('tableBody').innerHTML = `<tr><td colspan="1">ดึงข้อมูลไม่สำเร็จ: ${err.message}</td></tr>`;
      return;
    }
  }
  renderReport();
}

function renderReport() {
  const type = sel.value;
  const cfg = reportData[type];
  const label = reportTypes.find(r => r.id === type).label;

  document.getElementById('resultTitle').textContent = label;
  document.getElementById('reportTitle2').textContent = label;
  document.getElementById('purposeText').textContent = cfg.purpose;

  const branch = document.getElementById('branch').value;
  document.querySelectorAll('.company-name').forEach(()=>{});
  document.querySelector('.company-name').textContent = `ปรุงยาเภสัช (${branch})`;

  document.getElementById('metaRight').innerHTML = cfg.filterMode === 'month'
    ? `ข้อมูล ณ วันที่ 2026-08-26`
    : `ข้อมูล ณ วันที่ 2026-08-26<br>ข้อมูลจากวันที่ ${document.getElementById('dateFrom').value} ถึงวันที่ ${document.getElementById('dateTo').value}`;

  // extra filter row (ค้นหาลูกค้า / เลือกสินค้า / เลือกชุดสินค้า)
  const extraRow = document.getElementById('extraFilterRow');
  if (cfg.extraFilter === 'customer') {
    extraRow.style.display = 'block';
    extraRow.innerHTML = `<label>ค้นหาลูกค้า:</label><input type="text" placeholder="พิมพ์ชื่อลูกค้า..." value="จินตนา แก้วทุ่ง">`;
  } else if (cfg.extraFilter === 'product') {
    extraRow.style.display = 'block';
    extraRow.innerHTML = `<label>เลือกสินค้า:</label><input type="text" placeholder="ค้นหาสินค้า..." value="PCU00309 : Sonap Forte 550 mg">`;
  } else if (cfg.extraFilter === 'bundle') {
    extraRow.style.display = 'block';
    const opts = cfg.rows.map(r => `<option value="${r[1]}">${r[1]} : ${r[2]}</option>`).join('');
    extraRow.innerHTML = `<label>เลือกชุดสินค้า:</label><select id="bundleSelect" onchange="renderReport()"><option value="">-- ทั้งหมด --</option>${opts}</select>`;
    if (window._bundleSelectValue) {
      const el = document.getElementById('bundleSelect');
      if (el) el.value = window._bundleSelectValue;
    }
  } else {
    extraRow.style.display = 'none';
    extraRow.innerHTML = '';
  }

  // คำนวณรายการที่จะแสดง (กรองตามชุดสินค้าที่เลือก ถ้ามี)
  let rowsToShow = cfg.rows;
  if (cfg.extraFilter === 'bundle') {
    const bundleEl = document.getElementById('bundleSelect');
    const val = bundleEl ? bundleEl.value : '';
    window._bundleSelectValue = val;
    if (val) rowsToShow = cfg.rows.filter(r => r[1] === val);
  }

  document.getElementById('summaryStats').innerHTML = cfg.summary(rowsToShow);

  // table head
  const thead = document.getElementById('tableHead');
  thead.innerHTML = cfg.columns.map((c, i) => `<th class="${i >= (cfg.rightAlignFrom ?? 5) && typeof cfg.rows[0]?.[i] === 'number' ? 'num' : ''}">${c}</th>`).join('');

  const tbody = document.getElementById('tableBody');
  if (!rowsToShow.length) {
    tbody.innerHTML = `<tr><td colspan="${cfg.columns.length}"><div class="empty-row">ไม่พบรายการ</div></td></tr>`;
  } else {
    tbody.innerHTML = rowsToShow.map(row => `
      <tr>
        ${row.map((cell, i) => {
          const isNum = typeof cell === 'number';
          const display = isNum ? fmt(cell) : cell;
          return `<td class="${isNum ? 'num' : ''}">${display}</td>`;
        }).join('')}
      </tr>
    `).join('');
  }

  document.getElementById('resultCountText').textContent = '';
}

sel.value = 'daily';
onReportChange();

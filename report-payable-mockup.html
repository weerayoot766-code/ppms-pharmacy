<div class="topbar">
  <div class="logo-badge" onclick="window.location.href='backoffice-mockup.html'">💊</div>
  <div class="titles" onclick="window.location.href='backoffice-mockup.html'">
    <div class="th-name">ปรุงยาเภสัช — ระบบหลังบ้าน</div>
    <div class="en-name">Prungya Pharmacy and Medical System (PPMS)</div>
  </div>
  <button class="back-link" onclick="window.location.href='backoffice-mockup.html'">← กลับหน้าหลังบ้าน</button>

<div class="breadcrumb">
  หน้าหลัก <span class="sep">/</span> รายงาน <span class="sep">/</span> <b>หนี้คงค้างรายเดือน</b>
</div>

<div class="content">
  <div class="panel">
    <div class="panel-header"><h2>🧾 รายงานหนี้คงค้าง (เจ้าหนี้) รายเดือน</h2></div>
    <div class="pb">
      <div class="filters">
        <select id="fYear" onchange="render()"></select>
        <select id="fType" onchange="render()">
          <option value="">เครดิตทั้งหมด</option>
          <option value="เครดิตบริษัทยา">🏢 เครดิตบริษัทยา</option>
          <option value="เครดิตยี่ปั๊ว">🏪 เครดิตยี่ปั๊ว</option>
        </select>
        <span class="sp"></span>
        <button class="btn2" onclick="expandAll()">แสดงรายละเอียดทุกเดือน</button>
        <button class="btn2" onclick="window.print()">🖨️ พิมพ์</button>

      <div id="out"><div class="empty">⏳ กำลังโหลดข้อมูล...</div></div>
    </div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxfglKSQrUlsmroFU2e8GGA2xA5qEpKGazPNAX6yor2lJH5Xgt5b2Lo1EQIb-nNOJejmA/exec';

/**
 * ดึงข้อมูล (GET) — แนบรหัสคำขอ (requestId) ไปด้วย
 * บางครั้งสคริปต์ทำงานเสร็จแล้ว แต่ตอนรับผล Google ตอบ 404 (script.googleusercontent.com) แทนผลลัพธ์
 * ถ้าเจอ: ถามผลจริงด้วยรหัสเดิมก่อน (เร็ว) ถ้ายังไม่ได้ค่อยส่งใหม่ด้วยรหัสเดิม — หลังบ้านจำผลไว้ จึงตอบได้ทันทีไม่ต้องทำงานซ้ำ
 */
async function apiGet(action, params = {}) {
  const requestId = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const query = new URLSearchParams({ action, ...params, requestId }).toString();
  for (let attempt = 1; ; attempt++) {
    try {
      const res = await fetch(`${API_URL}?${query}`);
      return await readApiJson(res);
    } catch (err) {
      const transient = err.nonJson || err instanceof TypeError;
      if (!transient || attempt >= 4) throw err;
      console.warn('[PPMS] Google ตอบกลับผิดพลาด (' + action + ') กำลังกู้คืนครั้งที่ ' + attempt);
      await new Promise(r => setTimeout(r, 250));
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        const r = await readApiJson(await fetch(`${API_URL}?${q}`));
        if (r && r.found) {
          if (!r.response.ok) throw new Error(r.response.error);
          return r.response.data;
        }
      } catch (e2) { if (!e2.nonJson && !(e2 instanceof TypeError)) throw e2; }
      // ยังไม่ได้ผล → วนส่งคำขอเดิมใหม่ทันที (ไม่ต้องรอนาน)
    }
  }
}


/**
 * อ่านผลตอบกลับจาก Apps Script อย่างปลอดภัย
 * บางครั้ง Google ตอบกลับเป็นหน้า HTML (<!DOCTYPE ...) แทน JSON ทั้งที่สคริปต์ทำงานเสร็จไปแล้ว
 * ถ้าเจอแบบนั้นจะโยน error ที่มี flag nonJson = true ให้ผู้เรียกตัดสินใจเองว่าจะลองใหม่/ตรวจสอบซ้ำอย่างไร
 */
async function readApiJson(res) {
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    const err = new Error('เซิร์ฟเวอร์ Google ตอบกลับผิดรูปแบบชั่วคราว (ไม่ใช่ข้อมูล JSON)');
    err.nonJson = true;
    throw err;
  }
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/**
 * บันทึกข้อมูล (POST) — แนบรหัสคำขอ (requestId) ไปด้วยทุกครั้ง
 * ถ้า Google ตอบกลับเป็นหน้า HTML (ทั้งที่หลังบ้านบันทึกสำเร็จแล้ว) จะไปถามผลจริงด้วยรหัสนั้นผ่าน GET แทน
 * หลังบ้านจำผลของรหัสนี้ไว้ ถ้าคำขอเดิมถูกส่งซ้ำจะไม่ทำงานซ้ำ (กันบันทึกซ้ำ/ตัดสต๊อกซ้ำ)
 */
async function apiPost(action, payload = {}) {
  const requestId = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, requestId, ...payload }), // ห้ามตั้ง Content-Type เอง ไม่งั้นชน CORS preflight
    });
    return await readApiJson(res);
  } catch (err) {
    if (!err.nonJson && !(err instanceof TypeError)) throw err; // error จริงจากหลังบ้าน → แจ้งตามปกติ
    for (let attempt = 1; attempt <= 4; attempt++) {
      await new Promise(r => setTimeout(r, 700 * attempt));
      let r;
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        r = await readApiJson(await fetch(`${API_URL}?${q}`));
      } catch (e) { continue; }
      if (r && r.found) {
        if (!r.response.ok) throw new Error(r.response.error);
        return r.response.data;
      }
    }
    throw err;
  }
}


const TH_MONTHS = ['มกราคม','กุมภาพันธ์','มีนาคม','เมษายน','พฤษภาคม','มิถุนายน','กรกฎาคม','สิงหาคม','กันยายน','ตุลาคม','พฤศจิกายน','ธันวาคม'];
const CREDIT = ['เครดิตบริษัทยา', 'เครดิตยี่ปั๊ว'];
const esc = v => String(v == null ? '' : v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');
const money = n => (Number(n) || 0).toLocaleString('th-TH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const thDate = d => { const [y, m, dd] = String(d).split('-'); return y ? `${+dd}/${+m}/${+y + 543}` : '-'; };
let bills = [];      // ใบรับทั้งหมด
let openMonths = new Set();

async function load() {
  try {
    bills = await apiGet('getPayables');
  } catch (err) {
    document.getElementById('out').innerHTML = `<div class="empty">โหลดไม่สำเร็จ: ${esc(err.message)}</div>`;
    return;
  }
  const years = [...new Set(bills.filter(b => CREDIT.includes(b.payment) && b.date).map(b => b.date.slice(0, 4)))].sort().reverse();
  const sel = document.getElementById('fYear');
  sel.innerHTML = '<option value="">ทุกปี</option>' + years.map(y => `<option value="${y}">ปี ${+y + 543}</option>`).join('');
  const thisYear = String(new Date().getFullYear());
  if (years.includes(thisYear)) sel.value = thisYear;
  const now = new Date();
  openMonths.add(`${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`);
  render();
}

function render() {
  const y = document.getElementById('fYear').value, t = document.getElementById('fType').value;
  const credit = bills.filter(b => CREDIT.includes(b.payment) && (!t || b.payment === t) && (!y || (b.date || '').startsWith(y)));
  const unspecified = bills.filter(b => !b.payment && (!y || (b.date || '').startsWith(y)));
  const sum = (arr, type) => arr.filter(b => !type || b.payment === type).reduce((s, b) => s + b.total, 0);

  // จัดกลุ่มตามเดือน (ล่าสุดก่อน)
  const months = {};
  credit.forEach(b => { const k = (b.date || '????-??').slice(0, 7); (months[k] = months[k] || []).push(b); });
  const keys = Object.keys(months).sort().reverse();

  let html = `<div class="cards">
    <div class="card total"><div class="t">หนี้คงค้างรวม</div><div class="v">${money(sum(credit))}</div><div class="s">${credit.length} ใบ</div></div>
    <div class="card company"><div class="t">🏢 เครดิตบริษัทยา</div><div class="v">${money(sum(credit, 'เครดิตบริษัทยา'))}</div><div class="s">${credit.filter(b => b.payment === 'เครดิตบริษัทยา').length} ใบ</div></div>
    <div class="card wholesale"><div class="t">🏪 เครดิตยี่ปั๊ว</div><div class="v">${money(sum(credit, 'เครดิตยี่ปั๊ว'))}</div><div class="s">${credit.filter(b => b.payment === 'เครดิตยี่ปั๊ว').length} ใบ</div></div>
  </div>`;
  if (unspecified.length) html += `<div class="warn">⚠️ มีใบรับสินค้าที่ยังไม่ระบุวิธีชำระเงิน ${unspecified.length} ใบ (รวม ${money(sum(unspecified))} บาท) — ไม่ถูกนับในรายงานนี้ · <a href="receiving-list-mockup.html">ไประบุที่รายการใบรับสินค้า</a></div>`;

  if (!keys.length) {
    html += `<div class="empty">🎉 ไม่มีหนี้คงค้าง${y ? ' ในปี ' + (+y + 543) : ''}</div>`;
  } else {
    html += `<table class="m"><thead><tr><th>เดือน</th><th>จำนวนใบ</th><th>เครดิตบริษัทยา</th><th>เครดิตยี่ปั๊ว</th><th>รวมคงค้าง</th></tr></thead><tbody>`;
    keys.forEach(k => {
      const arr = months[k];
      const [yy, mm] = k.split('-');
      const label = mm && mm !== '??' ? `${TH_MONTHS[+mm - 1]} ${+yy + 543}` : 'ไม่ทราบวันที่';
      const open = openMonths.has(k);
      html += `<tr class="mrow ${open ? 'open' : ''}" onclick="toggleMonth('${k}')"><td>${label}</td><td>${arr.length}</td>
        <td>${money(sum(arr, 'เครดิตบริษัทยา'))}</td><td>${money(sum(arr, 'เครดิตยี่ปั๊ว'))}</td><td class="num-red">${money(sum(arr))}</td></tr>`;
      if (open) html += `<tr class="detail"><td colspan="5">${monthDetail(arr)}</td></tr>`;
    });
    html += `<tr class="foot"><td>รวมทั้งหมด</td><td>${credit.length}</td><td>${money(sum(credit, 'เครดิตบริษัทยา'))}</td><td>${money(sum(credit, 'เครดิตยี่ปั๊ว'))}</td><td class="num-red">${money(sum(credit))}</td></tr>`;
    html += `</tbody></table>`;
  }
  document.getElementById('out').innerHTML = html;
}

function monthDetail(arr) {
  const bySup = {};
  arr.forEach(b => { (bySup[b.supplier || '-'] = bySup[b.supplier || '-'] || []).push(b); });
  return Object.keys(bySup).sort((a, b) => bySup[b].reduce((s, x) => s + x.total, 0) - bySup[a].reduce((s, x) => s + x.total, 0)).map(sup => {
    const list = bySup[sup].sort((a, b) => (a.date < b.date ? -1 : 1));
    const tot = list.reduce((s, b) => s + b.total, 0);
    return `<div class="sup"><div class="sup-h"><span>${esc(sup)}</span><span class="num-red">${money(tot)} บาท</span></div>
      ${list.map(b => `<div class="bill">
        <span><b>${esc(b.docNo)}</b></span><span>${thDate(b.date)}</span>
        <span><span class="tag ${b.payment === 'เครดิตบริษัทยา' ? 'company' : 'wholesale'}">${b.payment === 'เครดิตบริษัทยา' ? '🏢 บริษัทยา' : '🏪 ยี่ปั๊ว'}</span></span>
        <span class="amt">${money(b.total)}</span>
        <button class="pay-btn" onclick="event.stopPropagation(); markPaid('${esc(b.docNo).replace(/'/g, "\\'")}', this)">✅ จ่ายแล้ว</button>
      </div>`).join('')}</div>`;
  }).join('');
}

function toggleMonth(k) { openMonths.has(k) ? openMonths.delete(k) : openMonths.add(k); render(); }
function expandAll() {
  bills.forEach(b => { if (CREDIT.includes(b.payment)) openMonths.add((b.date || '????-??').slice(0, 7)); });
  render();
}

async function markPaid(docNo, btn) {
  const b = bills.find(x => x.docNo === docNo);
  if (!b || !confirm(`บันทึกว่า "จ่ายเครดิตแล้ว"?\n\n${docNo} — ${b.supplier}\nยอด ${money(b.total)} บาท`)) return;
  btn.disabled = true;
  try {
    await apiPost('setReceivingPayment', { docNo, payment: 'จ่ายเครดิตแล้ว' });
    b.payment = 'จ่ายเครดิตแล้ว';
    render();
  } catch (err) {
    alert('บันทึกไม่สำเร็จ: ' + err.message);
    btn.disabled = false;
  }
}

load();
</script>

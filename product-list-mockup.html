<html lang="th">
<head>

<title>ปรุงยาเภสัช - รายการสินค้า (มอคอัพ)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Sarabun', 'Segoe UI', Arial, sans-serif;
    background: #dff3e3;
    margin: 0;
    color: #24312a;
  }

  .topbar {
    background: linear-gradient(90deg, #1e6b3c, #2e8b4f);
    color: #fff;
    padding: 14px 26px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .topbar .logo-badge {
    width: 32px; height: 32px;
    border-radius: 8px;

    display: flex; align-items: center; justify-content: center;

  .topbar .titles .th-name { font-size: 16px; font-weight: 700; }
  .topbar .titles .en-name { font-size: 11px; letter-spacing: .04em; opacity: .85; }
  .back-link {
    margin-left: auto;

    border-bottom: 1px solid #eef2ef;

    font-size: 16px; font-weight: 700; color: #1e6b3c; margin: 0;
    display: flex; align-items: center; gap: 8px;

    flex: 1;
    min-width: 220px;

    border: 1px solid #cfe0d3;
    border-radius: 8px;

    color: #fff;

  table.product-table { width: 100%; border-collapse: collapse; }

    text-align: left; font-size: 12.5px; color: #6b7a70; font-weight: 600;
    border-bottom: 2px solid #2e8b4f; padding: 10px 14px; white-space: nowrap;

    padding: 11px 14px; border-bottom: 1px solid #eef2ef; font-size: 13.5px; vertical-align: middle;
  }
  table.product-table tr:hover td { background: #f6faf7; }
  .tag-danger {
    display: inline-flex; align-items: center; justify-content: center;
    padding: 1px 7px; border-radius: 5px; background: #fdecea; color: #c0392b; border: 1px solid #f5b7b1;
    font-size: 11.5px; font-weight: 700; margin-left: 6px; white-space: nowrap; vertical-align: 1px;
  }
  .ds-select { padding: 5px 9px; border-radius: 999px; font-size: 12.5px; font-weight: 700; font-family: inherit; cursor: pointer; border: 1px solid; outline: none; }
  .ds-select:disabled { opacity: .6; }
  .ds-none { background: #fdecea; color: #c0392b; border-color: #f5c6c0; }
  .ds-done { background: #e3f0fb; color: #1d5f9e; border-color: #a9cdee; }
  .ds-stock { background: #e4f6e8; color: #1e6b3c; border-color: #9fd3ad; }
  .ds-select option { background: #fff; color: #24312a; font-weight: 400; }
  .ds-filter { padding: 9px 10px; border: 1px solid #cfe0d3; border-radius: 9px; font-size: 13.5px; font-family: inherit; background: #fff; }
  .status-pill { color: #2e8b4f; font-weight: 600; font-size: 13px; white-space: nowrap; }
  .status-pill.off { color: #c77700; }
  .status-pill small { display: block; font-weight: 400; font-size: 11.5px; color: #8fa198; }
  tr.inactive td { color: #a3ada7; }
  tr.inactive .status-pill { opacity: .6; }
  .toggle-switch.busy { opacity: .5; pointer-events: none; }
  .more-wrap { position: relative; }
  .more-menu { position: fixed; background: #fff; border: 1px solid #d7e4da; border-radius: 10px;
    box-shadow: 0 8px 24px rgba(20,60,35,.16); min-width: 190px; z-index: 30; display: none; overflow: hidden; }
  .more-menu.show { display: block; }
  .more-menu button { display: block; width: 100%; text-align: left; background: #fff; border: none; padding: 10px 14px;
    font-size: 13.5px; cursor: pointer; font-family: inherit; color: #24312a; }
  .more-menu button:hover { background: #f1f7f2; }
  .more-menu button.danger { color: #c0392b; border-top: 1px solid #f0f4f1; }
  .more-menu button.danger:hover { background: #fdecea; }
  .toggle-switch {
    width: 34px; height: 19px; border-radius: 10px; background: #cfe6d2; position: relative; cursor: pointer;
    display: inline-block;
  }
  .toggle-switch.on { background: #2e8b4f; }
  .toggle-switch .knob {
    position: absolute; top: 2px; left: 2px; width: 15px; height: 15px; border-radius: 50%;
    background: #fff; transition: left .15s;
  }
  .toggle-switch.on .knob { left: 17px; }

  .action-btns { display: flex; gap: 6px; }
  .icon-btn {
    width: 30px; height: 30px; border-radius: 6px; border: 1px solid #cfe0d3; background: #fff;
    display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 13px; color: #4a5a4f;
  }
  .icon-btn:hover { background: #eef6ee; border-color: #2e8b4f; color: #1e6b3c; }
  .icon-btn.edit:hover { background: #eef6ee; }

  .empty-state { padding: 40px; text-align: center; color: #8fa198; font-size: 13.5px; }

  .pagination { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 16px; }
  .pagination button {
    border: 1px solid #cfe0d3; background: #fff; border-radius: 6px; padding: 7px 12px;
    font-size: 13px; cursor: pointer; color: #4a5a4f;
  }
  .pagination button.active { background: #2e8b4f; border-color: #2e8b4f; color: #fff; font-weight: 600; }
  .pagination button:hover:not(.active) { background: #eef6ee; }
</style>

<body>

<div class="topbar">
  <div class="logo-badge" onclick="window.location.href='backoffice-mockup.html'">💊</div>
  <div class="titles" onclick="window.location.href='backoffice-mockup.html'">
    <div class="th-name">ปรุงยาเภสัช — ระบบหลังบ้าน</div>
    <div class="en-name">Prungya Pharmacy and Medical System (PPMS)</div>
  </div>
  <button class="back-link" onclick="window.location.href='backoffice-mockup.html'">← กลับหน้าหลังบ้าน</button>
</div>

<div class="breadcrumb">
  หน้าหลัก <span class="sep">/</span> ข้อมูลสินค้า <span class="sep">/</span> <b>รายการสินค้า</b>

<div class="content">
  <div class="panel">
    <div class="panel-header">
      <h2>📋 รายการสินค้า</h2>
      <div class="search-box">
        <input type="text" id="searchInput" placeholder="ค้นหาด้วยรหัสสินค้า หรือ ชื่อสินค้า...">
        <button onclick="doSearch()">🔍</button>
      </div>
      <select id="dsFilter" class="ds-filter" onchange="currentPage=1;loadProducts()" title="กรองตามการลงข้อมูลยา">
        <option value="">ทุกสถานะการลงข้อมูล</option>
        <option value="ยังไม่ลงข้อมูล">✗ ยังไม่ลงข้อมูล</option>
        <option value="ลงข้อมูลเรียบร้อย">✓ ลงข้อมูลเรียบร้อย</option>
        <option value="คงคลังปกติแล้ว">✓✓ คงคลังปกติแล้ว</option>
      </select>
      <button class="add-product-btn" onclick="window.location.href='product-edit-mockup.html?new=1'">＋ เพิ่มสินค้าใหม่</button>
    </div>

    <div class="result-count" id="resultCount"></div>

    <div style="overflow-x:auto;">
      <table class="product-table">
        <thead>
          <tr>
            <th style="width:50px;">#</th>
            <th style="width:120px;">รหัสสินค้า</th>
            <th>ชื่อสินค้า</th>
            <th style="width:175px;">การลงข้อมูลยา</th>
            <th style="width:130px;">สถานะ</th>
            <th style="width:100px;">เปิดใช้งาน</th>
            <th style="width:110px;">Action</th>
          </tr>
        </thead>
        <tbody id="productBody"></tbody>
      </table>
    </div>

    <div class="pagination" id="pagination"></div>
  </div>

<script>
// ================= ข้อมูลสินค้าตัวอย่าง (ของจริงบางส่วนจากไฟล์คงคลังที่ส่งมา) =================
const API_URL = 'https://script.google.com/macros/s/AKfycbxfglKSQrUlsmroFU2e8GGA2xA5qEpKGazPNAX6yor2lJH5Xgt5b2Lo1EQIb-nNOJejmA/exec';

/**
 * อ่านผลตอบกลับจาก Apps Script อย่างปลอดภัย
 * บางครั้ง Google ตอบกลับเป็นหน้า HTML (<!DOCTYPE ...) แทน JSON ชั่วคราว ทั้งที่สคริปต์ทำงานเสร็จไปแล้ว
 * ถ้าเจอแบบนั้นจะโยน error ที่มี flag nonJson = true ให้ผู้เรียกตัดสินใจเองว่าจะลองใหม่/ตรวจสอบซ้ำอย่างไร
 */
async function readApiJson(res) {
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    const err = new Error('เซิร์ฟเวอร์ Google ตอบกลับผิดรูปแบบชั่วคราว (ไม่ใช่ข้อมูล JSON)');
    err.nonJson = true;
    throw err;
  }
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/**
 * ดึงข้อมูล (GET) — แนบรหัสคำขอ (requestId) ไปด้วย
 * บางครั้งสคริปต์ทำงานเสร็จแล้ว แต่ตอนรับผล Google ตอบ 404 (script.googleusercontent.com) แทนผลลัพธ์
 * ถ้าเจอ: ถามผลจริงด้วยรหัสเดิมก่อน (เร็ว) ถ้ายังไม่ได้ค่อยส่งใหม่ด้วยรหัสเดิม — หลังบ้านจำผลไว้ จึงตอบได้ทันทีไม่ต้องทำงานซ้ำ
 */
async function apiGet(action, params = {}) {
  const requestId = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const query = new URLSearchParams({ action, ...params, requestId }).toString();
  for (let attempt = 1; ; attempt++) {
    try {
      const res = await fetch(`${API_URL}?${query}`);
      return await readApiJson(res);
    } catch (err) {
      const transient = err.nonJson || err instanceof TypeError;
      if (!transient || attempt >= 4) throw err;
      console.warn('[PPMS] Google ตอบกลับผิดพลาด (' + action + ') กำลังกู้คืนครั้งที่ ' + attempt);
      await new Promise(r => setTimeout(r, 250));
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        const r = await readApiJson(await fetch(`${API_URL}?${q}`));
        if (r && r.found) {
          if (!r.response.ok) throw new Error(r.response.error);
          return r.response.data;
        }
      } catch (e2) { if (!e2.nonJson && !(e2 instanceof TypeError)) throw e2; }
      // ยังไม่ได้ผล → วนส่งคำขอเดิมใหม่ทันที (ไม่ต้องรอนาน)
    }
  }
}


async function apiPost(action, payload = {}) {
  const requestId = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, requestId, ...payload }), // ห้ามตั้ง Content-Type เอง ไม่งั้นชน CORS preflight
    });
    return await readApiJson(res);
  } catch (err) {
    if (!err.nonJson && !(err instanceof TypeError)) throw err; // error จริงจากหลังบ้าน → แจ้งตามปกติ
    for (let attempt = 1; attempt <= 4; attempt++) {
      await new Promise(r => setTimeout(r, 700 * attempt));
      let r;
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        r = await readApiJson(await fetch(`${API_URL}?${q}`));
      } catch (e) { continue; }
      if (r && r.found) {
        if (!r.response.ok) throw new Error(r.response.error);
        return r.response.data;
      }
    }
    throw err;
  }
}

// ---------- ผู้ใช้งานที่ล็อกอินอยู่ ----------
(function () {
  if (!localStorage.getItem('ppms_user')) {
    window.location.href = 'login-mockup.html';
  }
})();

// ---------- รายการสินค้า: โหลดจริงจาก action 'listProducts' (แบ่งหน้า+ค้นหาฝั่ง server) ----------
let products = []; // สินค้าของหน้าปัจจุบัน (server แบ่งหน้าให้แล้ว ไม่ต้อง slice ซ้ำฝั่ง client)
let totalCount = 0;
let keyword = '';

let currentPage = 1;
const perPage = 10;

async function loadProducts() {
  const dataStatus = document.getElementById('dsFilter').value;
  const cacheKey = 'ppms_plist_' + [keyword, currentPage, perPage, dataStatus].join('|');
  // แสดงผลครั้งก่อนที่จำไว้ในเครื่องทันที แล้วค่อยอัปเดตเป็นข้อมูลล่าสุด
  let shownCached = false;
  try {
    const c = JSON.parse(localStorage.getItem(cacheKey) || 'null');
    if (c) { products = c.items; totalCount = c.total; renderTable(); shownCached = true;
      document.getElementById('resultCount').textContent += ' · ⏳ กำลังอัปเดตข้อมูลล่าสุด...'; }
  } catch (e) {}
  if (!shownCached) document.getElementById('productBody').innerHTML =
    `<tr><td colspan="7"><div class="empty-state">กำลังโหลดข้อมูลจริง...</div></td></tr>`;
  const myToken = ++loadToken;
  try {
    const data = await apiGet('listProducts', { keyword, page: currentPage, perPage, dataStatus });
    if (myToken !== loadToken) return; // ระหว่างรอ เปลี่ยนหน้า/คำค้นไปแล้ว
    products = data.items;
    totalCount = data.total;
    try { localStorage.setItem(cacheKey, JSON.stringify(data)); } catch (e) {}
  } catch (err) {
    if (myToken !== loadToken) return;
    if (!shownCached) document.getElementById('productBody').innerHTML =
      `<tr><td colspan="7"><div class="empty-state">ดึงข้อมูลไม่สำเร็จ: ${err.message}</div></td></tr>`;
    return;
  }
  renderTable();
}
let loadToken = 0;

function renderTable() {
  const body = document.getElementById('productBody');
  const start = (currentPage - 1) * perPage;

  if (products.length === 0) {
    body.innerHTML = `<tr><td colspan="7"><div class="empty-state">ไม่พบสินค้าที่ค้นหา</div></td></tr>`;
  } else {
    body.innerHTML = products.map((p, i) => `
      <tr class="${p.active ? '' : 'inactive'}" onmouseenter="warmProduct('${p.code}')" ontouchstart="warmProduct('${p.code}')">
        <td>${start + i + 1}</td>
        <td>${p.code}</td>
        <td>${p.name} ${p.danger ? '<span class="tag-danger" title="ยาที่ต้องลงบัญชีการขาย ขย.11 (ยาอันตรายเฉพาะรายการ)">ขย.11</span>' : ''}</td>
        <td>${dataStatusSelect(p, i)}</td>
        <td><span class="status-pill ${p.stock > 0 ? '' : 'off'}">${p.stock > 0 ? 'มีสินค้าในคลัง' : 'ของหมดชั่วคราว'}<small>${p.stock > 0 ? 'คงเหลือ ' + Number(p.stock).toLocaleString() + ' ' + (p.unit || '') : 'คงเหลือ 0'}</small></span></td>
        <td><div class="toggle-switch ${p.active ? 'on' : ''}" title="${p.active ? 'เปิดใช้งานอยู่ — กดเพื่อปิด (จะไม่ขึ้นในหน้าขาย)' : 'ปิดใช้งานอยู่ — กดเพื่อเปิด'}" onclick="toggleActive(${i}, this)"><div class="knob"></div></div></td>
        <td>
          <div class="action-btns">
            <button class="icon-btn" title="ดูรายละเอียด" onclick="window.location.href='product-edit-mockup.html?code=${p.code}'">📄</button>
            <button class="icon-btn edit" title="แก้ไข" onclick="window.location.href='product-edit-mockup.html?code=${p.code}'">✏️</button>
            <div class="more-wrap">
              <button class="icon-btn" title="เพิ่มเติม" onclick="toggleMore(event, ${i})">⋯</button>
              <div class="more-menu" id="more${i}">
                <button onclick="window.location.href='product-edit-mockup.html?code=${encodeURIComponent(p.code)}'">✏️ แก้ไขข้อมูลสินค้า</button>
                <button onclick="window.location.href='stock-adjust-mockup.html?code=${encodeURIComponent(p.code)}'">📦 ปรับสต๊อก</button>
                <button class="danger" onclick="deleteProductRow(${i})">🗑️ ลบรายการสินค้า</button>
              </div>
            </div>
          </div>
        </td>
      </tr>
    `).join("");
  }

  document.getElementById('resultCount').textContent = `พบ ${totalCount.toLocaleString()} รายการ`;
  renderPagination();
}

const DATA_STATUS = [
  { v: 'ยังไม่ลงข้อมูล', label: '✗ ยังไม่ลงข้อมูล', cls: 'ds-none' },
  { v: 'ลงข้อมูลเรียบร้อย', label: '✓ ลงข้อมูลเรียบร้อย', cls: 'ds-done' },
  { v: 'คงคลังปกติแล้ว', label: '✓✓ คงคลังปกติแล้ว', cls: 'ds-stock' },
];
function dataStatusSelect(p, i) {
  const cur = DATA_STATUS.find(o => o.v === p.dataStatus) || DATA_STATUS[0];
  return `<select class="ds-select ${cur.cls}" onchange="setDataStatus(${i}, this)">${DATA_STATUS.map(o => `<option value="${o.v}" ${o.v === cur.v ? 'selected' : ''}>${o.label}</option>`).join('')}</select>`;
}
async function setDataStatus(i, sel) {
  const p = products[i], prev = p.dataStatus, v = sel.value;
  sel.className = 'ds-select ' + (DATA_STATUS.find(o => o.v === v) || DATA_STATUS[0]).cls;
  sel.disabled = true;
  try {
    await apiPost('setProductDataStatus', { code: p.code, status: v });
    p.dataStatus = v;
  } catch (err) {
    alert('บันทึกสถานะไม่สำเร็จ: ' + err.message);
    sel.value = prev;
    sel.className = 'ds-select ' + (DATA_STATUS.find(o => o.v === prev) || DATA_STATUS[0]).cls;
  }
  sel.disabled = false;
}

// ชี้เมาส์ที่แถวไหน → สั่งหลังบ้านเตรียมข้อมูลสินค้านั้นไว้ล่วงหน้า (หน้าแก้ไขสินค้าจะเปิดได้เร็วขึ้นมาก)
const warmed = {};
function warmProduct(code) {
  if (!code || warmed[code]) return;
  warmed[code] = true;
  setTimeout(() => { apiGet('getProduct', { code }).catch(() => {}); }, 150);
}

function toggleMore(e, i) {
  e.stopPropagation();
  const m = document.getElementById('more' + i);
  const wasOpen = m.classList.contains('show');
  document.querySelectorAll('.more-menu.show').forEach(x => x.classList.remove('show'));
  if (wasOpen) return;
  // วางเมนูแบบ fixed ตามตำแหน่งปุ่ม (กันโดนกรอบตารางตัด)
  const r = e.currentTarget.getBoundingClientRect();
  m.classList.add('show');
  const mh = m.offsetHeight, mw = m.offsetWidth;
  const below = r.bottom + 4 + mh <= window.innerHeight;
  m.style.top = (below ? r.bottom + 4 : r.top - mh - 4) + 'px';
  m.style.left = Math.max(8, r.right - mw) + 'px';
}
window.addEventListener('scroll', () => document.querySelectorAll('.more-menu.show').forEach(x => x.classList.remove('show')), true);
document.addEventListener('click', () => document.querySelectorAll('.more-menu.show').forEach(x => x.classList.remove('show')));

async function toggleActive(i, el) {
  const p = products[i];
  const next = !p.active;
  if (!next && !confirm(`ปิดใช้งาน "${p.name}" ?\n\nสินค้านี้จะไม่ขึ้นในการค้นหาที่หน้าขาย (ข้อมูลและประวัติยังอยู่ครบ เปิดกลับได้ทุกเมื่อ)`)) return;
  el.classList.add('busy');
  try {
    await apiPost('setProductActive', { code: p.code, active: next });
    p.active = next;
    renderTable();
  } catch (err) {
    el.classList.remove('busy');
    alert('เปลี่ยนสถานะไม่สำเร็จ: ' + err.message);
  }
}

async function deleteProductRow(i) {
  const p = products[i];
  document.querySelectorAll('.more-menu.show').forEach(x => x.classList.remove('show'));
  if (p.stock > 0) {
    alert(`ลบ "${p.name}" ไม่ได้ — ยังมีของคงเหลือ ${Number(p.stock).toLocaleString()} ${p.unit || ''}\n\nถ้าจะเลิกขาย ให้กดปิด "เปิดใช้งาน" แทน หรือไปปรับสต๊อกเป็น 0 ก่อนแล้วค่อยลบ`);
    return;
  }
  if (!confirm(`⚠️ ยืนยันลบสินค้า?\n\n${p.code}  ${p.name}\n\nจะลบข้อมูลสินค้า หน่วย ราคา บาร์โค้ด และข้อมูลยาของรายการนี้ — กู้คืนไม่ได้\n(ประวัติการขาย/การรับสินค้าเดิมยังเก็บไว้)`)) return;
  if (!confirm(`ยืนยันอีกครั้ง: ลบ "${p.name}" ถาวร?`)) return;
  try {
    await apiPost('deleteProduct', { code: p.code });
    try { localStorage.removeItem('ppms_search_index_v1'); } catch (e) {}
    if (products.length === 1 && currentPage > 1) currentPage--;
    await loadProducts();
    alert(`ลบ "${p.name}" แล้ว`);
  } catch (err) {
    alert('ลบไม่สำเร็จ: ' + err.message);
  }
}

function renderPagination() {
  const totalPages = Math.max(1, Math.ceil(totalCount / perPage));
  const pag = document.getElementById('pagination');
  let html = '';
  const windowSize = 2;
  for (let i = 1; i <= totalPages; i++) {
    if (i === 1 || i === totalPages || (i >= currentPage - windowSize && i <= currentPage + windowSize)) {
      html += `<button class="${i === currentPage ? 'active' : ''}" onclick="goPage(${i})">${i}</button>`;
    } else if (i === currentPage - windowSize - 1 || i === currentPage + windowSize + 1) {
      html += `<span>…</span>`;
    }
  }
  pag.innerHTML = html;
}

function goPage(n) {
  currentPage = n;
  loadProducts();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function doSearch() {
  keyword = document.getElementById('searchInput').value.trim();
  currentPage = 1;
  loadProducts();
}

document.getElementById('searchInput').addEventListener('keyup', e => { if (e.key === 'Enter') doSearch(); });

loadProducts();
</script>

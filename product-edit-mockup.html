<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxfglKSQrUlsmroFU2e8GGA2xA5qEpKGazPNAX6yor2lJH5Xgt5b2Lo1EQIb-nNOJejmA/exec';


/**
 * อ่านผลตอบกลับจาก Apps Script อย่างปลอดภัย
 * บางครั้ง Google ตอบกลับเป็นหน้า HTML (<!DOCTYPE ...) แทน JSON ทั้งที่สคริปต์ทำงานเสร็จไปแล้ว
 * ถ้าเจอแบบนั้นจะโยน error ที่มี flag nonJson = true ให้ผู้เรียกตัดสินใจเองว่าจะลองใหม่/ตรวจสอบซ้ำอย่างไร
 */
async function readApiJson(res) {
  const text = await res.text();
  let json;
  try {
    json = JSON.parse(text);
  } catch (e) {
    const err = new Error('เซิร์ฟเวอร์ Google ตอบกลับผิดรูปแบบชั่วคราว (ไม่ใช่ข้อมูล JSON)');
    err.nonJson = true;
    throw err;
  }
  if (!json.ok) throw new Error(json.error);
  return json.data;
}

/**
 * ดึงข้อมูล (GET) — แนบรหัสคำขอ (requestId) ไปด้วย
 * บางครั้งสคริปต์ทำงานเสร็จแล้ว แต่ตอนรับผล Google ตอบ 404 (script.googleusercontent.com) แทนผลลัพธ์
 * ถ้าเจอ: ถามผลจริงด้วยรหัสเดิมก่อน (เร็ว) ถ้ายังไม่ได้ค่อยส่งใหม่ด้วยรหัสเดิม — หลังบ้านจำผลไว้ จึงตอบได้ทันทีไม่ต้องทำงานซ้ำ
 */
async function apiGet(action, params = {}) {
  const requestId = 'g' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  const query = new URLSearchParams({ action, ...params, requestId }).toString();
  for (let attempt = 1; ; attempt++) {
    try {
      const res = await fetch(`${API_URL}?${query}`);
      return await readApiJson(res);
    } catch (err) {
      const transient = err.nonJson || err instanceof TypeError;
      if (!transient || attempt >= 4) throw err;
      console.warn('[PPMS] Google ตอบกลับผิดพลาด (' + action + ') กำลังกู้คืนครั้งที่ ' + attempt);
      await new Promise(r => setTimeout(r, 250));
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        const r = await readApiJson(await fetch(`${API_URL}?${q}`));
        if (r && r.found) {
          if (!r.response.ok) throw new Error(r.response.error);
          return r.response.data;
        }
      } catch (e2) { if (!e2.nonJson && !(e2 instanceof TypeError)) throw e2; }
      // ยังไม่ได้ผล → วนส่งคำขอเดิมใหม่ทันที (ไม่ต้องรอนาน)
    }
  }
}

/**
 * บันทึกข้อมูล (POST) — แนบรหัสคำขอ (requestId) ไปด้วยทุกครั้ง
 * ถ้า Google ตอบกลับเป็นหน้า HTML (ทั้งที่หลังบ้านบันทึกสำเร็จแล้ว) จะไปถามผลจริงด้วยรหัสนั้นผ่าน GET แทน
 * หลังบ้านจำผลของรหัสนี้ไว้ ถ้าคำขอเดิมถูกส่งซ้ำจะไม่ทำงานซ้ำ (กันบันทึกซ้ำ/ตัดสต๊อกซ้ำ)
 */
async function apiPost(action, payload = {}) {
  const requestId = 'r' + Date.now().toString(36) + Math.random().toString(36).slice(2, 10);
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, requestId, ...payload }), // ห้ามตั้ง Content-Type เอง ไม่งั้นชน CORS preflight
    });
    return await readApiJson(res);
  } catch (err) {
    if (!err.nonJson && !(err instanceof TypeError)) throw err; // error จริงจากหลังบ้าน → แจ้งตามปกติ
    for (let attempt = 1; attempt <= 4; attempt++) {
      await new Promise(r => setTimeout(r, 700 * attempt));
      let r;
      try {
        const q = new URLSearchParams({ action: 'getResult', requestId }).toString();
        r = await readApiJson(await fetch(`${API_URL}?${q}`));
      } catch (e) { continue; }
      if (r && r.found) {
        if (!r.response.ok) throw new Error(r.response.error);
        return r.response.data;
      }
    }
    throw err;
  }
}

let realProductGroups = [];     // รายชื่อกลุ่มสินค้าทั้งหมดที่นิยามไว้ในระบบ (โหลดจริงตอนเปิดหน้า)
let productTypeChecked = [];

// "ต้องรายงาน ขย.9/10/11" — อ่านอย่างเดียวเท่านั้น ห้ามบันทึกทับจากหน้านี้ (ป้องกันทำลายสูตร/ข้อมูลที่ยืนยันแล้วในชีต)

// "พิมพ์รายงาน ขย.9/10/11" — แก้ไข/บันทึกได้จริงตามที่ชีตต้นทางระบุว่า override ได้
let printKY9 = false, printKY10 = false, printKY11 = false;
let treatmentClassChecked = [];

/** ถ้าพิมพ์ชื่อหน่วยที่ยังไม่มีในลิสต์ ให้เพิ่มเข้าไปอัตโนมัติทั้งในหน้าปัจจุบันและบันทึกถาวรลงชีต ใช้ซ้ำได้ทุกครั้งที่เปิดหน้านี้ในอนาคต */
async function registerCustomUnitName(name) {
  name = (name || '').trim();
  if (!name || commonUnitNames.includes(name)) return;
  commonUnitNames.push(name);
  const dl = document.getElementById('unitNameList');
  if (dl) dl.innerHTML = commonUnitNames.map(n => `<option value="${n}">`).join('');
  try {
    await apiPost('addCommonUnitName', { name });
  } catch (err) {
    console.error('บันทึกชื่อหน่วยใหม่ลงระบบถาวรไม่สำเร็จ (ใช้ได้แค่หน้านี้ชั่วคราว):', err.message);
  }
}

/**
 * สร้างบาร์โค้ดแบบ EAN-13 ให้อัตโนมัติสำหรับสินค้าที่ยังไม่มีบาร์โค้ดจริงจากผู้ผลิต
 * ใช้ prefix "20" (ช่วงเลขที่ GS1 สงวนไว้สำหรับใช้ภายในองค์กรเอง ไม่ชนกับบาร์โค้ดสินค้าแบรนด์จริงในตลาด)
 * คำนวณจากรหัสสินค้า+หน่วย เพื่อให้ได้เลขเดิมทุกครั้งถ้ากดสร้างซ้ำให้สินค้า/หน่วยเดียวกัน แล้วปิดท้ายด้วย checksum ที่ถูกต้องตามมาตรฐาน EAN-13
 */
function generateBarcode(code, unit) {
  const seed = (code || '') + '|' + (unit || '');
  let hash = 0;
  for (let i = 0; i < seed.length; i++) hash = (hash * 31 + seed.charCodeAt(i)) >>> 0;
  let digits = '20' + String(hash % 10000000000).padStart(10, '0');
  digits = digits.slice(0, 12);
  let sum = 0;
  for (let i = 0; i < 12; i++) {
    const d = Number(digits[i]);
    sum += (i % 2 === 0) ? d : d * 3;
  }
  const checksum = (10 - (sum % 10)) % 10;
  return digits + String(checksum);
}

let productLoadToken = 0;
async function loadProductByCode(code){
  const myToken = ++productLoadToken; // เลือกสินค้าใหม่ระหว่างรอ → ผลของตัวเก่าที่ตอบกลับมาทีหลังจะถูกทิ้ง ไม่ทับตัวใหม่
  const loadedTag = document.getElementById('loadedTag');
  loadedTag.style.display = 'inline-block';
  loadedTag.textContent = 'กำลังโหลดข้อมูล ' + code + '...';

  let detail;
  try {
    detail = await apiGet('getProduct', { code });
  } catch (err) {
    if (myToken !== productLoadToken) return;
    loadedTag.textContent = 'โหลดไม่สำเร็จ: ' + err.message;
    return;
  }
  if (myToken !== productLoadToken) return;

  const product = detail.product || {};
  currentProductRaw = product;
  const drugInfo = detail.drugInfo || {};
  currentProductCode = product['รหัสสินค้า'] || code;
  isNewProduct = false;

  document.getElementById('fProductCode').value = currentProductCode;
  document.getElementById('fProductCode').disabled = true;
  document.getElementById('fProductCode').classList.add('readonly');
  document.getElementById('fProductName').value = product['ชื่อสินค้า'] || '';
  document.getElementById('fGenericSummary').value = drugInfo['ชื่อยาสามัญ (Generic Name)'] || '-';
  document.getElementById('fIsDrug').checked = String(product['เป็นสินค้าประเภทยา (Y/N)'] || '').toUpperCase() !== 'N';
  document.getElementById('fActiveStatus').checked = String(product['สถานะเปิดใช้งาน (Y/N)'] || '').toUpperCase() !== 'N';

  // ---------- หน่วยนับ ----------
  const smallUnit = product['หน่วยเล็กสุด(อัตโนมัติ)'] || 'หน่วย';
  unitData = (detail.units || []).map(u => ({
    unit: u['หน่วย(ใหญ่)'],
    pack: Number(u['ตัวคูณ(กี่หน่วยเล็กสุดต่อ 1 หน่วยนี้)']) || 1,
    note: '',
    retail: (u['เป็นหน่วยขายปลีก (Y/N)'] || '') === 'Y',
    base: u['หน่วย(ใหญ่)'] === smallUnit,
  }));
  if (!unitData.some(u => u.unit === smallUnit)) {
    unitData.unshift({ unit: smallUnit, pack: 1, note: '', retail: true, base: true });
  }

  // ---------- บาร์โค้ด ----------
  barcodeData = (detail.barcodes || [])
    .filter(b => b['บาร์โค้ด'])
    .map(b => ({ unit: b['หน่วย'], code: b['บาร์โค้ด'] }));

  // ---------- ราคา ----------
  priceData = (detail.prices || []).map(p => ({
    branch: p['สาขา'] || '-',
    unit: p['หน่วย'] || '-',
    price: Number(p['ราคาขาย']) || 0,
    lastSold: p['ณ วันที่ขายล่าสุด'] || '',
  }));

  // ---------- ข้อมูลทางยา ----------
  genericNameData = parseGenericNameString(drugInfo['ชื่อยาสามัญ (Generic Name)'] || '');
  // "ต้องรายงาน" — อ่านอย่างเดียว (ห้ามบันทึกทับจากหน้านี้ กันทำลายสูตร/ข้อมูลที่ยืนยันแล้วในชีต)
  reqKY9 = (drugInfo['ต้องรายงาน ขย.9 (Y/N)'] || '') === 'Y';
  reqKY10 = (drugInfo['ต้องรายงาน ขย.10 (Y/N)'] || '') === 'Y';
  reqKY11 = (drugInfo['ต้องรายงาน ขย.11 (Y/N)'] || '') === 'Y';
  // "พิมพ์รายงาน" — แก้ไข/บันทึกได้จริง
  printKY9 = (drugInfo['พิมพ์รายงาน ขย.9 (Y/N)'] || '') === 'Y';
  printKY10 = (drugInfo['พิมพ์รายงาน ขย.10 (Y/N)'] || '') === 'Y';
  printKY11 = (drugInfo['พิมพ์รายงาน ขย.11 (Y/N)'] || '') === 'Y';
  treatmentClassChecked = drugInfo['Treatment Class'] ? drugInfo['Treatment Class'].split(',').map(s => s.trim()).filter(Boolean) : [];

  // ---------- ประเภทสินค้า ----------
  // ลองอ่านจากคอลัมน์ JSON ใหม่ก่อน (ครบทั้ง 10 หมวด) ถ้ายังไม่เคยมี fallback ไปอ่านจาก 2 คอลัมน์เดิม (ยาอันตราย/ยาควบคุมพิเศษ)
  let parsedTypes = null;
  try { parsedTypes = JSON.parse(drugInfo['ประเภทสินค้าอื่นๆ(JSON)'] || 'null'); } catch (e) { parsedTypes = null; }
  if (Array.isArray(parsedTypes)) {
    productTypeChecked = parsedTypes;
  } else {
    productTypeChecked = [];
    if ((drugInfo['เป็นยาอันตราย (Y/N)'] || '') === 'Y') productTypeChecked.push('ยาอันตราย');
    if ((drugInfo['เป็นยาควบคุมพิเศษ (Y/N)'] || '') === 'Y') productTypeChecked.push('ยาควบคุมพิเศษ');
  }

  // ---------- Safety Stock ----------
  safetyStockData = (detail.safetyStock || []).map(s => ({
    unit: s['หน่วย'] || '', branch: s['สาขา'] || 'สำนักงานใหญ่',
    max: s['Stock Max'] === '' || s['Stock Max'] == null ? '' : Number(s['Stock Max']),
    min: s['Stock Min'] === '' || s['Stock Min'] == null ? '' : Number(s['Stock Min']),
  }));

  // ---------- ชั้นวางสินค้า ----------
  shelfLocationData = (detail.shelfLocations || []).map(s => ({
    branch: s['สาขา'] || 'สำนักงานใหญ่', cabinetCode: s['รหัสตู้'] || '',
    cabinetName: s['ชื่อตู้'] || '', zone: s['โซน'] || '', shelf: s['ชั้น'] || '',
  }));

  // ---------- กลุ่มสินค้า 1-4 ----------
  productGroupsSelected = [
    product['กลุ่มสินค้า 1'] || '', product['กลุ่มสินค้า 2'] || '',
    product['กลุ่มสินค้า 3'] || '', product['กลุ่มสินค้า 4'] || '',
  ];

  // ---------- ผู้แทนจำหน่าย: ดึงประวัติจริงจากใบรับสินค้า (อ่านอย่างเดียว) ----------
  try {
    supplierHistoryData = await apiGet('getSupplierHistory', { code: currentProductCode });
  } catch (err) {
    supplierHistoryData = [];
  }

  // ---------- ค่าเริ่มต้นฉลากยา ----------
  let parsedDefaults = null;
  const rawDefaults = drugInfo['ค่าเริ่มต้นฉลากยา (LabelDefaults)'];
  if (rawDefaults) {
    try { parsedDefaults = JSON.parse(rawDefaults); } catch (e) { parsedDefaults = null; }
  }
  defaultLabel = {
    indication: (parsedDefaults && parsedDefaults.indication) || '',
    route: (parsedDefaults && parsedDefaults.route) || "รับประทาน",
    dose: (parsedDefaults && parsedDefaults.dose) || 1,
    doseUnit: (parsedDefaults && parsedDefaults.doseUnit) || "เม็ด",
    perDay: (parsedDefaults && parsedDefaults.perDay) || 1,
    times: {
      morning: parsedDefaults ? !!parsedDefaults.morning : true,
      noon: parsedDefaults ? !!parsedDefaults.noon : false,
      evening: parsedDefaults ? !!parsedDefaults.evening : false,
      bedtime: parsedDefaults ? !!parsedDefaults.bedtime : false,
    },
    mealTime: (parsedDefaults && parsedDefaults.mealTime) || "หลังอาหาร",
    every: { checked: parsedDefaults ? !!parsedDefaults.every : false, hours: (parsedDefaults && parsedDefaults.everyHr) || "" },
    prn: { checked: parsedDefaults ? !!parsedDefaults.prn : false, note: (parsedDefaults && parsedDefaults.prnNote) || "" },
    note: {
      checked: parsedDefaults && parsedDefaults.noteChecked !== undefined ? parsedDefaults.noteChecked : true,
      text: (parsedDefaults && parsedDefaults.note != null) ? parsedDefaults.note : "ทานยาหลังอาหารทันที",
    },
  };

  loadedTag.textContent = '✓ กำลังแก้ไข: ' + currentProductCode + ' — ' + (product['ชื่อสินค้า'] || '');

  // รีเฟรชแท็บที่กำลังเปิดอยู่ให้ตรงกับข้อมูลใหม่
  const activeTab = document.querySelector('.tab-item.active');
  switchTab(activeTab ? activeTab.dataset.tab : 'unit');
}

/** รวมรายการส่วนผสมทั้งหมดเป็นข้อความเดียว เช่น "Naproxen 250 mg, Paracetamol 500 mg" */
function buildGenericNameString() {
  return genericNameData
    .filter(g => g.name && g.name.trim())
    .map(g => {
      const mg = (g.mg || '').toString().trim();
      return mg ? `${g.name.trim()} ${mg} mg` : g.name.trim();
    })
    .join(', ');
}

/** อัปเดตช่อง "ชื่อยาสามัญ" ที่การ์ดข้อมูลพื้นฐานด้านบนสุดของหน้า ให้ตรงกับส่วนผสมที่พิมพ์ไว้แบบสดๆ */
function syncGenericSummary() {
  const combined = buildGenericNameString();
  const el = document.getElementById('fGenericSummary');
  if (el) el.value = combined || '-';
}

/** แยกข้อความ "ชื่อยาสามัญ" ก้อนเดียวจากข้อมูลเก่า กลับมาเป็นรายการ {name, mg} เท่าที่พอแยกได้ (รูปแบบ "ชื่อ ตัวเลข mg" คั่นด้วยจุลภาค) */
function parseGenericNameString(str) {
  if (!str || !str.trim() || str.trim() === '-') return [];
  return str.split(',').map(part => {
    part = part.trim();
    const match = part.match(/^(.*?)\s+([\d.]+)\s*mg$/i);
    return match ? { name: match[1].trim(), mg: match[2].trim() } : { name: part, mg: '' };
  }).filter(g => g.name);
}

function toggleInArray(arr, value, checked){
  const idx = arr.indexOf(value);
  if (checked && idx === -1) arr.push(value);
  else if (!checked && idx !== -1) arr.splice(idx, 1);
}

// ---------- ค้นหาสินค้า ----------
const productSearchInput = document.getElementById('productSearchInput');
const productSuggest = document.getElementById('productSuggest');
let searchDebounceTimer = null;

productSearchInput.addEventListener('input', () => {
  clearTimeout(searchDebounceTimer);
  searchDebounceTimer = setTimeout(doProductSearch, 300);
});
document.addEventListener('click', e => {
  if (!e.target.closest('.product-loader')) productSuggest.classList.remove('show');
});

async function doProductSearch(){
  const kw = productSearchInput.value.trim();
  if (!kw) { productSuggest.classList.remove('show'); return; }

  productSuggest.innerHTML = '<div class="product-suggest-item"><span>กำลังค้นหา...</span></div>';
  productSuggest.classList.add('show');

  let results;
  try {
    results = await apiGet('searchProducts', { keyword: kw });
  } catch (err) {
    productSuggest.innerHTML = `<div class="product-suggest-item"><span>ค้นหาไม่สำเร็จ: ${err.message}</span></div>`;
    return;
  }

  productSuggest.innerHTML = results.length === 0
    ? '<div class="product-suggest-item"><span>ไม่พบสินค้า</span></div>'
    : results.map(p => `
        <div class="product-suggest-item" onclick="pickProductToEdit('${p.code}')">
          <span>${p.name}</span>
          <b>${p.code}</b>
        </div>
      `).join('');
  productSuggest.classList.add('show');
}

function pickProductToEdit(code){
  productSuggest.classList.remove('show');
  productSearchInput.value = '';
  loadProductByCode(code);
}

// ================= ฟังก์ชันช่วยสร้าง SVG บาร์โค้ดง่ายๆ =================
function renderBarcodeSVG(code) {
  let bars = "";
  let x = 0;
  for (let i = 0; i < code.length; i++) {
    const d = parseInt(code[i], 10) || 1;
    const w = 1.6 + (d % 3) * 0.6;
    if (i % 2 === 0) bars += `<rect x="${x}" y="0" width="${w}" height="34" fill="#24312a"/>`;
    x += w + 1.1;
  }
  return `<svg class="barcode-svg" width="${Math.min(x, 220)}" height="42" viewBox="0 0 ${x} 42">${bars}<text x="0" y="41" font-size="7" fill="#4a5a4f">${code}</text></svg>`;
}

function renderUnitTab() {
  const smallUnit = unitData.find(u => u.base);
  return `
    <h3>หน่วย</h3>
    <div class="inline-fields" style="margin-bottom:20px;">
      <div class="field" style="max-width:220px;">
        <label>หน่วยเล็กสุด</label>
        ${isNewProduct
          ? `<input type="text" list="unitNameList" value="${smallUnit ? smallUnit.unit : ''}" placeholder="เช่น เม็ด, แผง, ขวด" oninput="unitData[0].unit=this.value; syncBaseUnitDisplay(this.value);" onchange="registerCustomUnitName(this.value)">`
          : `<input type="text" value="${smallUnit ? smallUnit.unit : '-'}" class="readonly" disabled>`}

            <td style="text-align:right;">${s.cost.toFixed(2)}</td>
          </tr>
        `).join("")}
      </tbody>
    </table>
    `}
    <div class="connected-hint">✅ ดึงจากประวัติใบรับสินค้าจริงทั้งหมด (ไม่ใช่ข้อมูลที่พิมพ์เอง) เรียงจากรับล่าสุดไปเก่าสุด — ถ้าอยากรับสินค้าจากผู้แทนรายใหม่ ให้ไปบันทึกที่หน้า "รับสินค้า" ตามปกติ ประวัติจะโผล่ที่นี่ให้อัตโนมัติ</div>
  `;
}

async function saveAll(){
  if (!isNewProduct && !currentProductCode) { alert('ยังไม่ได้เลือกสินค้า'); return; }

  // ---------- โหมด "เพิ่มสินค้าใหม่": เช็คข้อมูลจำเป็นก่อน แล้วสร้างแถวสินค้าใหม่ในระบบ (รันรหัส PCU ให้อัตโนมัติ) ----------
  if (isNewProduct) {
    const newName = document.getElementById('fProductName').value.trim();
    if (!newName) { alert('กรุณากรอกชื่อสินค้า'); return; }
    if (unitData.length === 0 || !unitData[0].unit.trim()) {
      alert('กรุณากรอก "หน่วยเล็กสุด" ในแท็บ "หน่วย" ก่อน (เช่น เม็ด, แผง, ขวด)');
      return;
    }

    const btn = document.getElementById('mainSaveBtn');
    btn.disabled = true;
    btn.textContent = '⏳ กำลังสร้างสินค้าใหม่...';
    try {
      const result = await apiPost('createProduct', {
        product: {
          name: newName,
          smallUnit: unitData[0].unit.trim(),
          isDrug: document.getElementById('fIsDrug').checked,
          active: document.getElementById('fActiveStatus').checked,
        }
      });
      currentProductCode = result.code; // รหัสจริงที่ระบบรันให้อัตโนมัติ (เช่น PCU00501)
      document.getElementById('fProductCode').value = currentProductCode;
      isNewProduct = false;
    } catch (err) {
      alert('สร้างสินค้าใหม่ไม่สำเร็จ: ' + err.message);
      btn.disabled = false;
      btn.textContent = '💾 บันทึก';
      return;
    }
    btn.disabled = false;
    btn.textContent = '💾 บันทึก';
  }

  // เช็คว่าทุกแถวหน่วยมีชื่อหน่วยกรอกไว้แล้ว (กันบันทึกแถวว่างเปล่าเข้าระบบ)
  const emptyUnitRow = unitData.some((u, i) => i > 0 && !u.base && !u.unit.trim());
  if (emptyUnitRow) { alert('กรุณากรอกชื่อหน่วยให้ครบทุกแถวในแท็บ "หน่วย" (หรือลบแถวที่ยังไม่ได้กรอกออกก่อน)'); return; }

  // อ่านจาก defaultLabel โดยตรง (อัปเดตสดทุกครั้งที่พิมพ์ในแท็บสำหรับพิมพ์ ไม่ว่าจะเคยสลับไปแท็บอื่นแล้วกลับมาก็ตาม)
  const defaults = {
    indication: defaultLabel.indication,
    route: defaultLabel.route,
    dose: defaultLabel.dose,
    doseUnit: defaultLabel.doseUnit,
    perDay: defaultLabel.perDay,
    mealTime: defaultLabel.mealTime,
    morning: defaultLabel.times.morning,
    noon: defaultLabel.times.noon,
    evening: defaultLabel.times.evening,
    bedtime: defaultLabel.times.bedtime,
    every: defaultLabel.every.checked,
    everyHr: defaultLabel.every.hours,
    prn: defaultLabel.prn.checked,
    prnNote: defaultLabel.prn.note,
    noteChecked: defaultLabel.note.checked,
    note: defaultLabel.note.text,
  };

  const btn = document.getElementById('mainSaveBtn');
  btn.disabled = true;
  btn.textContent = '⏳ กำลังบันทึก...';

  try {
    // ส่งทุกแท็บไปในคำขอเดียว (เดิมส่งแยก 9 คำขอต่อกัน ใช้เวลารวม ~30 วินาที)
    await apiPost('saveProductAll', {
      code: currentProductCode,
      all: {
        product: {
          name: document.getElementById('fProductName').value.trim(),
          isDrug: document.getElementById('fIsDrug').checked,
          active: document.getElementById('fActiveStatus').checked,
          groups: productGroupsSelected,
        },
        labelDefaults: defaults,
        genericName: buildGenericNameString(),
        units: unitData,
        barcodes: barcodeData,
        prices: priceData,
        drugMeta: {
          productTypes: productTypeChecked,
          printKY9: printKY9, printKY10: printKY10, printKY11: printKY11,
          treatmentClass: treatmentClassChecked,
        },
        safetyStock: safetyStockData,
        shelfLocations: shelfLocationData,
      }
    });
    alert('บันทึกเรียบร้อย\n\n✅ ข้อมูลสินค้า "' + currentProductCode + '" บันทึกเข้าระบบจริงแล้วทั้งหมด (ชื่อสินค้า, หน่วย, บาร์โค้ด, ราคา, ชื่อยาสามัญ, ประเภทสินค้า, รายงาน ขย., Treatment Class, Safety Stock, ชั้นวางสินค้า, กลุ่มสินค้า, ค่าเริ่มต้นฉลากยา)\n\n⚠️ เหลือแค่ "ผู้แทนจำหน่าย" ที่เปลี่ยนเป็นดึงประวัติจริงจากใบรับสินค้าให้อัตโนมัติแล้ว ไม่ต้องบันทึกอะไรเพิ่มในส่วนนั้น');
    // โหลดข้อมูลสินค้าใหม่จาก sheet เพื่อยืนยันว่าที่บันทึกไปตรงกับที่ระบบเก็บจริง (เช่น ลำดับแถวใหม่)
    await loadProductByCode(currentProductCode);
  } catch (err) {
    alert('บันทึกไม่สำเร็จ: ' + err.message);
  }
  btn.disabled = false;
  btn.textContent = '💾 บันทึก';
}

const tabRenderers = {
  unit: renderUnitTab,
  barcode: renderBarcodeTab,
  price: renderPriceTab,
  stock: renderStockTab,
  drug: renderDrugTab,
  supplier: renderSupplierTab,
  print: renderPrintTab,
};

function switchTab(key) {
  document.querySelectorAll('.tab-item').forEach(el => el.classList.toggle('active', el.dataset.tab === key));
  document.getElementById('tabContent').innerHTML = tabRenderers[key]();
}

document.getElementById('tabMenu').addEventListener('click', e => {
  const item = e.target.closest('.tab-item');
  if (item) switchTab(item.dataset.tab);
});

const urlParams = new URLSearchParams(window.location.search);
loadCommonUnitNames(); // โหลดรายชื่อหน่วยที่ใช้บ่อยจากชีตจริง (ไม่ต้องรอ ให้โหลดขนานไปกับข้อมูลสินค้าด้านล่าง)
loadRealProductGroups(); // โหลดรายชื่อกลุ่มสินค้าจริงจากระบบเช่นกัน
if (urlParams.get('new')) {
  resetToNewProduct();
} else {
  switchTab(urlParams.get('code') ? 'print' : 'unit');
  if (urlParams.get('code')) {
    loadProductByCode(urlParams.get('code')); // มี ?code=... ต่อท้าย URL → เปิดสินค้านั้นโดยตรง (เช่น ลิงก์มาจากหน้าขาย/รายการสินค้า)
  } else {
    // ไม่โหลดสินค้าตัวอย่างอัตโนมัติแล้ว (เดิมโหลด Sonap ทุกครั้ง ทำให้ช้าและอาจทับสินค้าที่ค้นเลือก) → รอผู้ใช้ค้นหาเอง
    const tag = document.getElementById('loadedTag');
    tag.style.display = 'inline-block';
    tag.textContent = '🔍 พิมพ์ค้นหาสินค้าที่ต้องการแก้ไขด้านบน';
  }
}

function renderSection(key){
  const sec = sections[key];

  // เมนูหลัก active state
  document.querySelectorAll('.nav-item').forEach(el => {
    el.classList.toggle('active', el.dataset.section === key);
  });

  // breadcrumb + heading
  document.getElementById('breadcrumb').innerHTML = `หน้าหลัก <span class="sep">/</span> <b>${sec.label}</b>`;
  document.getElementById('sectionHeading').textContent = sec.label;

  // grid ไอคอน
  const grid = document.getElementById('iconGrid');
  if(sec.items.length === 0){
    grid.innerHTML = `<div style="grid-column:1/-1;color:#6b8a75;padding:30px 0;">หน้านี้เป็นภาพรวม/แดชบอร์ด — ยังไม่ออกแบบในมอคอัพนี้</div>`;
  } else {
    grid.innerHTML = sec.items.map(item => {
      const action = item.href
        ? `window.location.href='${item.href}'`
        : `alert('มอคอัพ: จะเปิดหน้า ${item.label}')`;
      return `
      <div class="icon-card" onclick="${action}">
        <div class="icon-circle">${icons[item.icon]}</div>
        <div class="icon-label">${item.label}</div>
      </div>
    `;
    }).join('');
  }
}

document.getElementById('mainNavItems').addEventListener('click', e => {
  const item = e.target.closest('.nav-item');
  if(item) renderSection(item.dataset.section);
});

renderSection('product');

function toggleUserMenu(e) {
  e.stopPropagation();
  document.getElementById('userDropdown').classList.toggle('show');
}
document.addEventListener('click', () => {
  document.getElementById('userDropdown').classList.remove('show');
});

// ---------- ผู้ใช้งานที่ล็อกอินอยู่ ----------
(function () {
  const raw = localStorage.getItem('ppms_user');
  if (!raw) {
    window.location.href = 'login-mockup.html';
    return;
  }
  try {
    const user = JSON.parse(raw);
    document.getElementById('topbarUserName').textContent = user['ชื่อ-นามสกุล'] || user['Username'] || 'ผู้ใช้งาน';
  } catch (e) {
    window.location.href = 'login-mockup.html';
  }
})();

function doLogout() {
  localStorage.removeItem('ppms_user');
  window.location.href = 'login-mockup.html';
}
</script>

</body>
</html>
